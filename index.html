<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Acqua - Sensory Analysis</title>
<meta name="description" content="Sensory Quality Control System">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--d:#0a1628;--n:#0d2137;--b:#0064C8;--s:#009DE0;--l:#35C4F0;--g:#f0f4f8;--w:#fff;--t1:#1a202c;--t2:#4a5568;--t3:#718096;--t4:#a0aec0;--brd:#e2e8f0;--red:#dc2626;--grn:#059669;--amb:#d97706;--pur:#7c3aed}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--g);color:var(--t1);line-height:1.6}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer;border:none;outline:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 3px rgba(0,100,200,.1)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:999px}
.page{display:none;min-height:100vh}.page.active{display:flex}
.login-page{background:linear-gradient(160deg,var(--d),#0d2137 35%,#0f3460 70%,#16213e);align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--w);border-radius:1.25rem;padding:2.5rem;width:100%;max-width:26rem;box-shadow:0 25px 60px -12px rgba(0,0,0,.4)}
.login-logo{width:3rem;height:3rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;font-size:1.5rem;color:#fff}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.625rem;font-weight:700;margin-bottom:.25rem}
.login-card p{color:var(--t3);font-size:.875rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}.field label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.375rem}
.field input,.field select,.field textarea{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.875rem;transition:all .15s}
.field textarea{height:auto;padding:.75rem;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:.625rem;font-weight:600;font-size:.875rem;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--b),var(--s));color:#fff;box-shadow:0 4px 14px -3px rgba(0,100,200,.4)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px -3px rgba(0,100,200,.5)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--w);color:var(--t2);border:1px solid var(--brd)}.btn-secondary:hover{background:#f7fafc}
.btn-sm{padding:.375rem .75rem;font-size:.75rem;border-radius:.5rem}
.btn-full{width:100%}
.btn-danger{background:#fee2e2;color:var(--red);border:1px solid #fecaca}.btn-danger:hover{background:#fecaca}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:.5rem;padding:.75rem;color:var(--red);font-size:.8125rem;margin-bottom:1rem}
.sidebar{width:16rem;background:linear-gradient(180deg,var(--d),var(--n) 50%,#0f3460);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s}
.sidebar .logo{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .logo .icon{width:2.5rem;height:2.5rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.sidebar .logo h2{font-family:'Space Grotesk',sans-serif;font-size:1.125rem;font-weight:700}
.sidebar .logo span{font-size:.625rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em}
.sidebar nav{flex:1;padding:1rem;display:flex;flex-direction:column;gap:.25rem;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:rgba(255,255,255,.5);transition:all .2s;text-decoration:none;cursor:pointer}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:#fff}
.sidebar .user-box{padding:1rem;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .user-box .avatar{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.sidebar .user-box .info{flex:1;min-width:0}
.sidebar .user-box .name{font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .user-box .role{font-size:.625rem;color:rgba(255,255,255,.5)}
.main{flex:1;margin-left:16rem;padding:2rem}
.main-header{margin-bottom:2rem}.main-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}.main-header p{font-size:.8125rem;color:var(--t3);margin-top:.25rem}
.card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:.75rem;background:#fafbfc}
.card-header h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.875rem}
.card-body{padding:1.5rem}
.grid{display:grid;gap:1rem}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--w);border:1px solid var(--brd);border-radius:.75rem;padding:1.25rem;display:flex;align-items:center;gap:.75rem}
.stat-card .stat-icon{width:2.5rem;height:2.5rem;border-radius:.625rem;display:flex;align-items:center;justify-content:center;font-size:1.125rem}
.stat-card .stat-val{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;line-height:1}
.stat-card .stat-lbl{font-size:.6875rem;color:var(--t3);margin-top:.25rem}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8125rem}
th{background:var(--d);color:#fff;padding:.75rem;text-align:left;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:.625rem .75rem;border-bottom:1px solid #f1f5f9}
tr:hover{background:#f8fafc}
.badge{display:inline-flex;align-items:center;padding:.25rem .625rem;border-radius:999px;font-size:.6875rem;font-weight:600;white-space:nowrap}
.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}.badge-blue{background:#dbeafe;color:#1e40af}.badge-amber{background:#fef3c7;color:#92400e}.badge-purple{background:#ede9fe;color:#5b21b6}
.filter-bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding:1rem 1.5rem}
.filter-bar label{font-size:.75rem;font-weight:500;color:var(--t3)}
.filter-bar input,.filter-bar select{height:2rem;padding:0 .625rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.75rem}
.session-code{font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:700;letter-spacing:.15em;color:var(--b);text-align:center;background:#f8fafc;border:2px dashed var(--brd);border-radius:.75rem;padding:1rem}
.test-card{border:1px solid var(--brd);border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.test-card h4{font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.radio-group{display:flex;gap:1rem}.radio-option{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.radio-option input[type=radio]{width:1rem;height:1rem;accent-color:var(--b)}
.radio-option label{font-size:.875rem;font-weight:500;cursor:pointer}
.radio-option.in label{color:var(--grn)}.radio-option.out label{color:var(--red)}
.report-card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.report-header{padding:2rem;border-bottom:1px solid #f1f5f9}
.report-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
.report-header p{color:var(--t3);font-size:.8125rem}
.report-body{padding:2rem}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem;border-radius:.5rem;border:1px solid var(--brd);margin-bottom:.5rem}
.result-row.pass{background:#f0fdf4;border-color:#bbf7d0}.result-row.fail{background:#fef2f2;border-color:#fecaca}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:1rem;padding:1.5rem;width:100%;max-width:40rem;margin:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.toast{position:fixed;top:1rem;right:1rem;z-index:200;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:#fff;box-shadow:0 8px 30px -5px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}.toast.success{background:#059669}.toast.error{background:#dc2626}.toast.info{background:#0064C8}
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:var(--w);border-bottom:1px solid var(--brd);padding:.75rem 1rem;align-items:center;justify-content:space-between}
.hamburger{background:none;font-size:1.25rem;padding:.25rem}
@media print{.no-print{display:none!important}body{background:#fff!important}.main{margin-left:0!important;padding:0!important}}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);width:16rem}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:1rem}.mobile-header{display:flex!important}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="page-login" class="page login-page active">
  <div style="text-align:center;margin-bottom:2rem;color:#fff">
    <div style="font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;margin-bottom:.5rem">Global Acqua</div>
    <div style="font-size:.75rem;opacity:.6;letter-spacing:.1em;text-transform:uppercase">Sensory Quality Control</div>
  </div>
  <div class="login-card">
    <div class="login-logo">💧</div>
    <h1>Welcome back</h1>
    <p>Sign in to access your sensory analysis dashboard</p>
    <div id="login-error" class="err" style="display:none"></div>
    <div class="field"><label>Username</label><input type="text" id="login-user" placeholder="Enter username"></div>
    <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="Enter password"></div>
    <button class="btn btn-primary btn-full" id="login-btn" style="height:2.75rem">Sign In</button>
    <div style="margin-top:1rem;padding:.75rem;background:#f0f4f8;border-radius:.5rem;font-size:.6875rem;color:var(--t3)">
      <b>Demo Accounts:</b><br>
      Admin: admin / admin123<br>
      User: SD / sd123
    </div>
    <div style="text-align:center;margin-top:1rem;font-size:.75rem;color:var(--t4)">Developed by <b>Mr Saila Ruidas</b> with <b>Emergent Lab</b></div>
  </div>
</div>

<div id="page-app" class="page">
  <div class="mobile-header"><div style="display:flex;align-items:center;gap:.5rem"><div style="width:2rem;height:2rem;border-radius:.5rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.875rem">💧</div><span style="font-weight:700;font-size:.8125rem">Global Acqua</span></div><button class="hamburger" id="hamburger-btn">☰</button></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo"><div class="icon">💧</div><div><h2>Global Acqua</h2><span id="sidebar-role-label">Panel</span></div></div>
    <nav id="sidebar-nav"></nav>
    <div class="user-box">
      <div class="avatar" id="sidebar-avatar">A</div>
      <div class="info"><div class="name" id="sidebar-name">Admin</div><div class="role" id="sidebar-role-text">Administrator</div></div>
      <button class="btn btn-sm" id="logout-btn" style="color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)">Out</button>
    </div>
  </aside>
  <div class="main" id="main-content"></div>
</div>

<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>

<script>
(function(){
"use strict";

/* ===== DB ===== */
var STORE_KEY = "gaq_db";

function dbLoad(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {users:[],sessions:[]}; }
  catch(e){ return {users:[]}; }
}
function dbSave(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

function simpleHash(s){
  var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h=h|0; }
  return "h"+h;
}

function makeId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Math.random().toString(36).slice(2)+Date.now().toString(36);
}
function isoNow(){ return new Date().toISOString(); }

function dbInit(){
  var d=dbLoad();
  if(!d.users||!d.users.length){
    d.users=[
      {id:makeId(),username:"admin",password:simpleHash("admin123"),role:"admin",createdAt:isoNow()},
      {id:makeId(),username:"Saila Ruidas",password:simpleHash("saila123"),role:"admin",createdAt:isoNow()},
      {id:makeId(),username:"SD",password:simpleHash("sd123"),role:"user",createdAt:isoNow()},
      {id:makeId(),username:"RM",password:simpleHash("rm123"),role:"user",createdAt:isoNow()},
      {id:makeId(),username:"SC",password:simpleHash("sc123"),role:"user",createdAt:isoNow()},
      {id:makeId(),username:"SM",password:simpleHash("sm123"),role:"user",createdAt:isoNow()}
    ];
    d.sessions=[];
    dbSave(d);
  }
  return d;
}

function findUser(u,p){
  var d=dbLoad();
  for(var i=0;i<d.users.length;i++){
    if(d.users[i].username===u && d.users[i].password===simpleHash(p)) return d.users[i];
  }
  return null;
}

function getAllSessions(){ return dbLoad().sessions||[]; }
function findSession(code){
  var s=dbLoad().sessions||[];
  for(var i=0;i<s.length;i++){ if(s[i].sessionCode===code) return s[i]; }
  return null;
}

function createSession(code,count,type,user){
  var d=dbLoad();
  var s={id:makeId(),sessionCode:code,status:"in_progress",targetPanelistCount:count,testType:type||"regular",ballots:[],createdBy:user,createdAt:isoNow(),completedAt:null};
  d.sessions.push(s); dbSave(d); return s;
}

function submitBallotToSession(code,ballot){
  var d=dbLoad(); var s=null;
  for(var i=0;i<d.sessions.length;i++){ if(d.sessions[i].sessionCode===code){ s=d.sessions[i]; break; }}
  if(!s) return null;
  s.ballots.push(ballot);
  if(s.ballots.length>=s.targetPanelistCount){ s.status="completed"; s.completedAt=isoNow(); }
  dbSave(d); return s;
}

function deleteSession(code){
  var d=dbLoad();
  d.sessions=(d.sessions||[]).filter(function(x){return x.sessionCode!==code;});
  dbSave(d);
}

function addUser(u,p,r){
  var d=dbLoad();
  for(var i=0;i<d.users.length;i++){ if(d.users[i].username===u) return false; }
  d.users.push({id:makeId(),username:u,password:simpleHash(p),role:r,createdAt:isoNow()});
  dbSave(d); return true;
}

function deleteUser(u){
  var d=dbLoad();
  d.users=(d.users||[]).filter(function(x){return x.username!==u;});
  dbSave(d);
}

function getUsers(){
  return dbLoad().users.map(function(u){ return {username:u.username,role:u.role,createdAt:u.createdAt}; });
}

/* ===== HELPERS ===== */
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(s){ if(!s)return"N/A"; return new Date(s).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); }
function fmtDateTime(s){ if(!s)return"N/A"; return new Date(s).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

function showToast(msg,type){
  var t=document.getElementById("toast");
  t.textContent=msg; t.className="toast "+type+" show";
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show");},3500);
}

function genCode(){
  var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", c="GAQ-";
  for(var i=0;i<6;i++) c+=A[Math.floor(Math.random()*A.length)];
  return c;
}

function colorBg(c){
  var m={Control:"#e5e7eb",Yellow:"#fef08a",Brown:"#a16207",Blue:"#3b82f6",Green:"#22c55e",Red:"#ef4444",Purple:"#a855f7"};
  return m[c]||"#ccc";
}
function colorTxt(c){ return (c==="Control"||c==="Yellow"||c==="Green")?"#000":"#fff"; }

/* ===== STATE ===== */
var user=null, view="dashboard";
var activeCode="", ballotNum=1, ballotInit=null, selectedTest="regular", viewingSession=null;
var joinCode="", testSelect=false;
var sSearch="", sFrom="", sTo="", sStatus="all";
var genType="regular", genCount="3", genCode="";

/* ===== DOM HELPERS ===== */
function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.add("active"); }
function hide(id){ $(id).classList.remove("active"); }

/* ===== LOGIN ===== */
function doLogin(){
  var u=$("login-user").value.trim();
  var p=$("login-pass").value;
  if(!u||!p){ $("login-error").textContent="Please enter username and password"; $("login-error").style.display="block"; return; }
  var found=findUser(u,p);
  if(!found){ $("login-error").textContent="Incorrect username or password"; $("login-error").style.display="block"; return; }
  $("login-error").style.display="none";
  user={username:found.username,role:found.role};
  showApp();
}

function doLogout(){
  user=null; view="dashboard";
  hide("page-app"); show("page-login");
  $("login-user").value=""; $("login-pass").value="";
}

function showApp(){
  hide("page-login"); show("page-app");
  $("sidebar-name").textContent=user.username;
  $("sidebar-avatar").textContent=user.username.charAt(0).toUpperCase();
  $("sidebar-role-label").textContent=user.role==="admin"?"Admin Panel":"Sensory Panel";
  $("sidebar-role-text").textContent=user.role==="admin"?"Administrator":"Panelist";
  buildNav();
  navTo("dashboard");
  showToast("Welcome, "+user.username+"!","success");
}

/* ===== NAV ===== */
function buildNav(){
  var nav=$("sidebar-nav");
  var html="";
  if(user.role==="admin"){
    html+='<a data-nav="dashboard">📊 Dashboard</a>';
    html+='<a data-nav="users">👥 User Management</a>';
    html+='<a data-nav="sessions">📋 All Sessions</a>';
    html+='<a data-nav="generate">🔑 Generate Code</a>';
    html+='<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)">';
    html+='<div style="font-size:.625rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;padding:0 1rem;margin-bottom:.5rem">Reports</div>';
    html+='<a data-rpt="daily">📅 Daily Summary</a>';
    html+='<a data-rpt="blind">🎯 Blind Test Summary</a>';
    html+='<a data-rpt="proficiency">⭐ Proficiency Summary</a></div>';
  } else {
    html+='<a data-nav="dashboard">📊 Dashboard</a>';
    html+='<a data-nav="active">📋 Active Session</a>';
  }
  nav.innerHTML=html;
  nav.querySelectorAll("a[data-nav]").forEach(function(a){
    a.onclick=function(){ navTo(a.getAttribute("data-nav")); };
  });
  nav.querySelectorAll("a[data-rpt]").forEach(function(a){
    a.onclick=function(){ openReport(a.getAttribute("data-rpt")); };
  });
}

function navTo(v){
  view=v;
  document.querySelectorAll(".sidebar nav a").forEach(function(a){a.classList.remove("active");});
  var el=document.querySelector('.sidebar nav a[data-nav="'+v+'"]');
  if(el) el.classList.add("active");
  render();
  $("sidebar").classList.remove("open");
}

/* ===== RENDER ===== */
function render(){
  var m=$("main-content");
  switch(view){
    case"dashboard": m.innerHTML=user.role==="admin"?rAdminDash():rUserDash(); break;
    case"users": m.innerHTML=rUsers(); break;
    case"sessions": m.innerHTML=rSessions(); attachFilters(); break;
    case"generate": m.innerHTML=rGenerate(); break;
    case"active": m.innerHTML=rActive(); break;
    case"ballot": m.innerHTML=rBallot(); attachRadio(); break;
    case"report": m.innerHTML=rReport(); break;
    default: m.innerHTML=user.role==="admin"?rAdminDash():rUserDash();
  }
}

/* ===== ADMIN DASHBOARD ===== */
function rAdminDash(){
  var ss=getAllSessions(), today=new Date().toDateString();
  var done=ss.filter(function(s){return s.status==="completed";});
  var todayN=done.filter(function(s){return s.createdAt&&new Date(s.createdAt).toDateString()===today;}).length;
  var ballots=ss.reduce(function(a,s){return a+s.ballots.length;},0);
  var h='<div class="main-header"><h1>Admin Dashboard</h1><p>Welcome, '+esc(user.username)+'</p></div>';
  h+='<div class="grid grid-4" style="margin-bottom:2rem">';
  h+=statCard("📊","var(--b)","#eff6ff",ss.length,"Total Sessions");
  h+=statCard("✅","var(--grn)","#f0fdf4",done.length,"Completed");

/* ===== SESSION FLOW ===== */
function startSession(count,testType){
  testType=testType||"regular";
  var c=genCode();
  while(findSession(c)) c=genCode();
  createSession(c,count,testType,user.username);
  activeCode=c; ballotNum=1; ballotInit=null; selectedTest=testType;
  showToast("Session "+c+" created!","success");
  view="ballot"; render();
}

function joinSession(){
  var inp=$("join-code-input");
  var raw=inp?inp.value:joinCode;
  var code=raw.trim().toUpperCase();
  if(!code){showToast("Enter a session code","error");return;}
  var s=findSession(code);
  if(!s){showToast("Session not found. Check the code.","error");return;}
  if(s.status==="completed"){showToast("Session already completed","error");return;}
  activeCode=code; ballotNum=s.ballots.length+1; selectedTest=s.testType||"regular";
  if(s.ballots.length>0){
    var f=s.ballots[0];
    ballotInit={productType:f.productType,otherProductType:f.otherProductType,productVariant:f.productVariant,otherProductVariant:f.otherProductVariant,productCode:f.productCode,dateOfMfg:f.dateOfMfg,controlSampleCode:f.controlSampleCode,productTime:f.productTime};
  } else { ballotInit=null; }
  joinCode=""; view="ballot"; render();
  showToast("Joined session "+code+"!","success");
}

function viewSession(code){
  var s=findSession(code);
  if(!s){showToast("Session not found","error");return;}
  viewingSession=s; view="report"; render();
}

function submitBallot(data){
  var updated=submitBallotToSession(activeCode,data);
  if(!updated){showToast("Failed to submit","error");return;}
  if(updated.status==="completed"){
    viewingSession=updated; view="report"; render();
    showToast("Session completed!","success");
  } else {
    ballotNum=updated.ballots.length+1;
    if(updated.ballots.length===1&&selectedTest==="regular"){
      ballotInit={productType:data.productType,otherProductType:data.otherProductType,productVariant:data.productVariant,otherProductVariant:data.otherProductVariant,productCode:data.productCode,dateOfMfg:data.dateOfMfg,controlSampleCode:data.controlSampleCode,productTime:data.productTime};
    }
    render();
    showToast("Submitted! Waiting for "+(updated.targetPanelistCount-updated.ballots.length)+" more.","success");
  }
}

  h+='<div class="field"><label>Round *</label><input name="roundNo" required value="1"></div>';
  h+='<div class="field"><label>Provider</label><input name="provider"></div>';
  h+='</div></div></div>';
  h+='<div class="card" style="margin-bottom:1rem"><div class="card-header"><h3>Sample Evaluation</h3></div><div class="card-body">';
  colors.forEach(function(c,ci){
    h+='<div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:.5rem;margin-bottom:.5rem;align-items:center;padding:.5rem;border:1px solid var(--brd);border-radius:.5rem">';

  });

  h+='<div class="field"><label>Test Code</label><input name="testCode"></div>';
  h+='<div class="field"><label>Date *</label><input name="testDate" type="date" required value="'+cd+'"></div>';
  h+='<div class="field"><label>Time *</label><input name="testTime" type="time" required value="'+ct+'"></div>';
  h+='<div class="field"><label>Round *</label><input name="roundNo" required value="1"></div>';
  h+='<div class="field"><label>Provider</label><input name="provider"></div>';

  h+='<div class="card" style="margin-bottom:1rem"><div class="card-header"><h3>Proficiency Samples</h3></div><div class="card-body">';

/* ===== REPORT ===== */
function rReport(){
  var s=viewingSession; if(!s) return "<p>No session</p>";
  var ballots=s.ballots||[], total=s.targetPanelistCount;
  var pct=Math.min(100,Math.round((ballots.length/total)*100));
  var isBlind=s.testType==="blind"||s.testType==="proficiency";
  var checks=0,ins=0;
  var cat={Appearance:{i:0,t:0},Odour:{i:0,t:0},Taste:{i:0,t:0}};
  ballots.forEach(function(b){
    ["appearance","odour","taste"].forEach(function(k){
      if(b[k]&&b[k].status){
        var lk=k.charAt(0).toUpperCase()+k.slice(1);
        cat[lk].t++;checks++;
        if(b[k].status==="IN"){cat[lk].i++;ins++;}
      }
    });
  });
  var passPct=checks?Math.round((ins/checks)*100):null;
  var allP=passPct===100;

  var h='<div style="max-width:50rem;margin:0 auto">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem">';
  h+='<button class="btn btn-sm btn-secondary" data-action="back-dash">← Dashboard</button>';
  h+='<button class="btn btn-sm btn-primary" id="print-btn">Print</button></div>';

  var qC=allP?"var(--grn)":"var(--red)", qB=allP?"#f0fdf4":"#fef2f2";
  h+='<div class="grid grid-3" style="margin-bottom:1.5rem">';
  h+=statCard("👥","var(--b)","#eff6ff",ballots.length+"/"+total,"Panelists ("+pct+"%)");
  h+='<div class="stat-card"><div class="stat-icon" style="background:'+qB+';color:'+qC+'">✅</div><div><div class="stat-val" style="color:'+qC+'">'+(passPct!==null?passPct+"%":"—")+'</div><div class="stat-lbl">Quality Rate</div></div></div>';
  h+=statCard("📋","var(--pur)","#f5f3ff",s.testType||"regular","Test Type");
  h+='</div>';

  var title=s.testType==="blind"?"Sensory Blind Test Report":s.testType==="proficiency"?"Proficiency Test Report":"Sensory Evaluation Report";
  h+='<div class="report-card"><div class="report-header"><h1>'+title+'</h1>';
  h+='<p>Global Acqua Pvt Ltd · Sensory Quality Control</p>';
  h+='<div style="display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap">';
  h+='<div class="badge badge-blue" style="font-family:\'Space Grotesk\',monospace;font-size:.875rem;padding:.5rem 1rem">'+s.sessionCode+'</div>';
  h+='<div style="font-size:.8125rem;color:var(--t3)">Completed: '+fmtDateTime(s.completedAt||s.createdAt)+'</div></div></div>';
  h+='<div class="report-body">';

  ["Appearance","Odour","Taste"].forEach(function(n){
    var cv=cat[n]; if(cv.t===0) return;
    var cp=Math.round((cv.i/cv.t)*100);
    var cc=cp===100?"var(--grn)":"var(--b)";
    h+='<div style="margin-bottom:.75rem"><div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.25rem"><span style="font-weight:600">'+n+'</span><span style="font-weight:700;color:'+cc+'">'+cp+'% IN ('+cv.i+'/'+cv.t+')</span></div>';
    h+='<div style="height:.5rem;background:#f1f5f9;border-radius:999px;overflow:hidden"><div style="height:100%;width:'+cp+'%;background:'+cc+';border-radius:999px"></div></div></div>';
  });

  h+='<h3 style="font-family:\'Space Grotesk\',sans-serif;font-size:.875rem;font-weight:600;margin:1.5rem 0 1rem;color:var(--t2)">Panelist Evaluations</h3>';

  ballots.forEach(function(b,idx){
    var pBg=isBlind?"#f5f3ff":"#eff6ff", pBd=isBlind?"#ede9fe":"#dbeafe", pC=isBlind?"var(--pur)":"var(--b)";
    h+='<div style="border:1px solid var(--brd);border-radius:.75rem;margin-bottom:1rem;overflow:hidden">';
    h+='<div style="background:'+pBg+';padding:.75rem 1rem;border-bottom:1px solid '+pBd+';display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">';
    h+='<div style="display:flex;align-items:center;gap:.5rem"><span style="width:1.75rem;height:1.75rem;background:'+pC+';color:#fff;border-radius:.375rem;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700">'+(idx+1)+'</span><span style="font-weight:600">'+esc(b.panelistName||"Panelist "+(idx+1))+'</span></div>';
    if(b.testingCompletionDate) h+='<span style="font-size:.6875rem;color:var(--t3)">'+b.testingCompletionDate+' '+(b.testingCompletionTime||"")+'</span>';
    h+='</div><div style="padding:1rem">';

    if(isBlind&&b.samples){
      h+='<table style="width:100%"><thead><tr style="background:#fafbfc"><th>Sl</th><th>Color Code</th><th>Result</th><th>OFF Note</th></tr></thead><tbody>';
      b.samples.forEach(function(sm,si){
        h+='<tr><td>'+(sm.colorCode==="Control"?"Ctrl":si)+'</td>';
        h+='<td><span class="badge" style="background:'+colorBg(sm.colorCode)+';color:'+colorTxt(sm.colorCode)+'">'+sm.colorCode+'</span></td>';
        h+='<td><span class="badge '+(sm.status==="IN"?"badge-green":"badge-red")+'">'+(sm.colorCode==="Control"?"IN (Ctrl)":sm.status)+'</span></td>';
        h+='<td>'+(sm.colorCode==="Control"?"N/A":(sm.offNote||"-"))+'</td></tr>';
      });
      h+='</tbody></table>';
    } else {
      h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.5rem;margin-bottom:.75rem">';
      if(b.productType) h+='<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Type</div><div style="font-size:.8125rem;font-weight:600">'+esc(b.productType==="Other"?b.otherProductType:b.productType)+'</div></div>';
      if(b.productCode) h+='<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Code</div><div style="font-size:.8125rem;font-weight:600;font-family:monospace">'+esc(b.productCode)+'</div></div>';
      if(b.dateOfMfg) h+='<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Mfg Date</div><div style="font-size:.8125rem;font-weight:600">'+b.dateOfMfg+'</div></div>';
      h+='</div>';

      var keys=["appearance","odour"];
      if(b.productType!=="Raw Water") keys.push("taste");
      keys.forEach(function(k){
        if(!b[k]) return;
        var rc=b[k].status==="IN"?"pass":"fail";
        var lb=k.charAt(0).toUpperCase()+k.slice(1);
        h+='<div class="result-row '+rc+'"><span style="font-weight:500">'+lb+'</span><div style="display:flex;align-items:center;gap:.5rem"><span class="badge '+(b[k].status==="IN"?"badge-green":"badge-red")+'">'+b[k].status+'</span>';
        if(b[k].status==="OUT") h+='<span style="font-size:.75rem;color:var(--red)">'+esc(b[k].reason)+'</span>';
        h+='</div></div>';
      });
      if(b.remarks) h+='<div style="margin-top:.5rem;background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Remarks</div><div style="font-size:.8125rem">'+esc(b.remarks)+'</div></div>';
    }
    h+='</div></div>';
  });

  h+='<div style="text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid #f1f5f9;font-size:.75rem;color:var(--t4)">Generated by <b>Global Acqua Pvt Ltd</b> · Sensory Analysis System</div>';
  h+='</div></div></div>';
  return h;
}

function rActive(){
  var s=findSession(activeCode);
  if(!s) return "<p>No active session.</p>";
  if(s.status==="completed"){viewingSession=s;view="report";return rReport();}
  view="ballot"; return rBallot();
}

/* ===== REPORTS MODAL ===== */
function openReport(type){
  var ss=getAllSessions();
  var f;
  if(type==="daily") f=ss.filter(function(s){return(!s.testType||s.testType==="regular")&&s.status==="completed";});
  else if(type==="blind") f=ss.filter(function(s){return s.testType==="blind"&&s.status==="completed";});
  else f=ss.filter(function(s){return s.testType==="proficiency"&&s.status==="completed";});

  var title=type==="daily"?"Daily Summary":type==="blind"?"Blind Test Summary":"Proficiency Summary";
  var h='<div style="max-height:70vh;overflow-y:auto">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h3 style="font-weight:700">'+title+'</h3><button class="btn btn-sm btn-secondary" id="close-modal-btn">Close</button></div>';
  h+='<div class="table-wrap"><table style="width:100%;font-size:.8125rem"><thead><tr><th>Code</th><th>Product</th><th>Panelists</th><th>Result</th><th>Date</th></tr></thead><tbody>';
  if(f.length){
    f.forEach(function(s){
      var fb=s.ballots[0]||{};
      var allIn=s.ballots.every(function(x){return(x.appearance&&x.appearance.status==="IN")&&(x.odour&&x.odour.status==="IN")&&((x.taste&&x.taste.status==="IN")||x.productType==="Raw Water");});
      h+='<tr><td style="font-weight:700;color:var(--b)">'+s.sessionCode+'</td>';
      h+='<td>'+esc(fb.productType==="Other"?fb.otherProductType:(fb.productType||"-"))+'</td>';
      h+='<td>'+s.ballots.length+'/'+s.targetPanelistCount+'</td>';
      h+='<td><span class="badge '+(allIn?"badge-green":"badge-red")+'">'+(allIn?"IN":"OUT")+'</span></td>';
      h+='<td>'+fmtDate(s.completedAt)+'</td></tr>';
    });
  } else {
    h+='<tr><td colspan="5" style="text-align:center;color:var(--t4);padding:2rem">No completed sessions yet</td></tr>';
  }
  h+='</tbody></table></div></div>';
  $("modal-content").innerHTML=h;
  $("modal-overlay").classList.add("show");
  $("close-modal-btn").onclick=function(){$("modal-overlay").classList.remove("show");};
}

/* ===== RADIO BUTTON TOGGLE ===== */
function attachRadio(){
  document.querySelectorAll(".test-card").forEach(function(tc){
    var radios=tc.querySelectorAll("input[type=radio]");
    var rw=tc.querySelector(".reason-wrap");
    if(!rw) return;
    radios.forEach(function(r){
      r.onchange=function(){ rw.style.display=(r.value==="OUT"&&r.checked)?"block":"none"; };
    });
  });
}

/* ===== GLOBAL EVENT DELEGATION ===== */
document.addEventListener("click",function(e){
  var t=e.target;

  /* Login */
  if(t.id==="login-btn"){ doLogin(); return; }

  /* Logout */
  if(t.id==="logout-btn"){ doLogout(); return; }

  /* Hamburger */
  if(t.id==="hamburger-btn"){ $("sidebar").classList.toggle("open"); return; }

  /* Sidebar nav links - handled by onclick in buildNav */

  /* Back to dashboard */
  if(t.dataset.action==="back-dash"){ navTo("dashboard"); return; }

  /* Test select */
  if(t.dataset.action==="test-select"){ testSelect=true; render(); return; }
  if(t.dataset.action==="cancel-test"){ testSelect=false; render(); return; }

  /* Start session */
  if(t.dataset.action==="start"){
    var cnt=t.dataset.count?parseInt(t.dataset.count):1;
    var tp=t.dataset.type||"regular";
    startSession(cnt,tp);
    return;
  }

  /* Generate code nav */
  if(t.dataset.action==="generate"){ navTo("generate"); return; }
  if(t.dataset.action==="sessions"){ navTo("sessions"); return; }
  if(t.dataset.action==="users"){ navTo("users"); return; }

  /* View session */
  if(t.dataset.viewSess){ viewSession(t.dataset.viewSess); return; }

  /* Delete session */
  if(t.dataset.delSess){
    if(confirm("Delete session "+t.dataset.delSess+"?")){
      deleteSession(t.dataset.delSess);
      showToast("Session deleted","success");
      render();
    }
    return;
  }

  /* Delete user */
  if(t.dataset.delUser){
    var du=t.dataset.delUser;
    if(du===user.username){showToast("Cannot delete yourself","error");return;}
    if(confirm("Delete user "+du+"?")){
      deleteUser(du);
      showToast("User deleted","success");
      render();
    }
    return;
  }

  /* Create user */
  if(t.id==="create-user-btn"){
    var u=$("new-u").value.trim();
    var p=$("new-p").value;
    var r=$("new-r").value;
    if(!u||!p){showToast("Username and password required","error");return;}
    if(addUser(u,p,r)){showToast("User created!","success");render();}
    else showToast("Username already exists","error");
    return;
  }

  /* Generate button */
  if(t.id==="gen-btn"){
    var gc=genCode();
    while(findSession(gc)) gc=genCode();
    var gt=$("gen-type")?$("gen-type").value:genType;
    var gcn=$("gen-count")?$("gen-count").value:genCount;
    genType=gt; genCount=gcn;
    createSession(gc,parseInt(gcn),gt,user.username);
    genCode=gc;
    showToast("Session "+gc+" created!","success");
    render();
    return;
  }

  /* Copy code */
  if(t.id==="copy-code-btn"){
    if(navigator.clipboard) navigator.clipboard.writeText(genCode).then(function(){showToast("Copied!","info");});
    else showToast("Code: "+genCode,"info");
    return;
  }

  /* Print */
  if(t.id==="print-btn"){ window.print(); return; }

  /* Modal close on overlay */
  if(t.id==="modal-overlay"){ $("modal-overlay").classList.remove("show"); return; }

  /* Nav links with data-nav and data-rpt */
  if(t.dataset.nav){ navTo(t.dataset.nav); return; }
  if(t.dataset.rpt){ openReport(t.dataset.rpt); return; }
});

/* ===== FORM SUBMISSION DELEGATION ===== */
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id!=="ballot-form") return;

  var fd=new FormData(e.target);

  /* Blind / Proficiency */
  var s=findSession(activeCode);
  if(s && (s.testType==="blind"||s.testType==="proficiency")){
    var colors=["Control","Yellow","Brown","Blue","Green","Red","Purple"];
    var samples=colors.map(function(c,i){
      return {colorCode:c,status:fd.get("sample_"+i+"_status"),offNote:fd.get("sample_"+i+"_offNote")||""};
    });
    submitBallot({panelistName:fd.get("panelistName"),testCode:fd.get("testCode"),testDate:fd.get("testDate"),testTime:fd.get("testTime"),roundNo:fd.get("roundNo"),provider:fd.get("provider"),samples:samples});
    return;
  }

  /* Regular */
  var d={
    panelistName:fd.get("panelistName"),
    productType:fd.get("productType"),
    otherProductType:fd.get("otherProductType")||"",
    productVariant:fd.get("productVariant")||"",
    otherProductVariant:"",
    productCode:fd.get("productCode"),
    dateOfMfg:fd.get("dateOfMfg"),
    controlSampleCode:fd.get("controlSampleCode"),
    productTime:fd.get("productTime"),
    testingCompletionDate:fd.get("completionDate"),
    testingCompletionTime:fd.get("completionTime"),
    remarks:fd.get("remarks")||"",
    appearance:{status:fd.get("appearance"),reason:fd.get("appearanceReason")||"",otherReason:""},
    odour:{status:fd.get("odour"),reason:fd.get("odourReason")||"",otherReason:""},
    taste:{status:fd.get("taste")||"IN",reason:fd.get("tasteReason")||"",otherReason:""}
  };
  if(d.productType==="Raw Water") d.taste={status:"IN",reason:"",otherReason:""};
  submitBallot(d);
});

/* ===== INPUT DELEGATION ===== */
document.addEventListener("input",function(e){
  if(e.target.id==="join-code-input"){
    joinCode=e.target.value.toUpperCase();
    var btn=$("join-btn");
    if(btn) btn.disabled=!joinCode.trim();
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    if(e.target.id==="login-user") $("login-pass").focus();
    else if(e.target.id==="login-pass") doLogin();
    else if(e.target.id==="join-code-input"&&joinCode.trim()) joinSession();
  }
});

/* ===== INIT ===== */
dbInit();
console.log("Global Acqua loaded. Users:",getUsers().length);

})();
</script>
