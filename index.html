<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Acqua - Sensory Analysis</title>
<meta name="description" content="Sensory Quality Control System - Water quality sensory evaluation">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--d:#0a1628;--n:#0d2137;--b:#0064C8;--s:#009DE0;--l:#35C4F0;--g:#f0f4f8;--w:#fff;--t1:#1a202c;--t2:#4a5568;--t3:#718096;--t4:#a0aec0;--brd:#e2e8f0;--red:#dc2626;--grn:#059669;--amb:#d97706;--pur:#7c3aed}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--g);color:var(--t1);line-height:1.6;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer;border:none;outline:none}
input:focus,select:focus,textarea:focus{outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:var(--b);border-radius:999px}
.page{display:none;min-height:100vh}
.page.active{display:flex}
.login-page{background:linear-gradient(160deg,var(--d) 0%,#0d2137 35%,#0f3460 70%,#16213e 100%);align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--w);border-radius:1.25rem;padding:2.5rem;width:100%;max-width:26rem;box-shadow:0 25px 60px -12px rgba(0,0,0,.4)}
.login-logo{width:3rem;height:3rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;font-size:1.5rem;color:#fff}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.625rem;font-weight:700;color:var(--t1);margin-bottom:.25rem}
.login-card p{color:var(--t3);font-size:.875rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.375rem}
.field input,.field select,.field textarea{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.875rem;transition:all .15s}
.field input:focus,.field select:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(0,100,200,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:.625rem;font-weight:600;font-size:.875rem;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--b),var(--s));color:#fff;box-shadow:0 4px 14px -3px rgba(0,100,200,.4)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px -3px rgba(0,100,200,.5)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--w);color:var(--t2);border:1px solid var(--brd)}
.btn-secondary:hover{background:#f7fafc}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-sm{padding:.375rem .75rem;font-size:.75rem;border-radius:.5rem}
.btn-full{width:100%}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:.5rem;padding:.75rem;color:var(--red);font-size:.8125rem;margin-bottom:1rem}
.msg{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:.5rem;padding:.75rem;color:var(--grn);font-size:.8125rem;margin-bottom:1rem}
/* Layout */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:16rem;background:linear-gradient(180deg,var(--d),var(--n) 50%,#0f3460);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s}
.sidebar .logo{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .logo .icon{width:2.5rem;height:2.5rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.sidebar .logo h2{font-family:'Space Grotesk',sans-serif;font-size:1.125rem;font-weight:700}
.sidebar .logo span{font-size:.625rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em}
.sidebar nav{flex:1;padding:1rem;display:flex;flex-direction:column;gap:.25rem}
.sidebar nav a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:rgba(255,255,255,.5);transition:all .2s;text-decoration:none;cursor:pointer}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:#fff}
.sidebar .user-box{padding:1rem;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .user-box .avatar{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.sidebar .user-box .info{flex:1;min-width:0}
.sidebar .user-box .name{font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .user-box .role{font-size:.625rem;color:rgba(255,255,255,.5)}
.main{flex:1;margin-left:16rem;padding:2rem}
.main-header{margin-bottom:2rem}
.main-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;color:var(--t1)}
.main-header p{font-size:.8125rem;color:var(--t3);margin-top:.25rem}
/* Cards */
.card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:.75rem;background:#fafbfc}
.card-header h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.875rem}
.card-body{padding:1.5rem}
/* Grid */
.grid{display:grid;gap:1rem}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-header{display:flex!important}}
/* Stats */
.stat-card{background:var(--w);border:1px solid var(--brd);border-radius:.75rem;padding:1.25rem;display:flex;align-items:center;gap:.75rem}
.stat-card .stat-icon{width:2.5rem;height:2.5rem;border-radius:.625rem;display:flex;align-items:center;justify-content:center;font-size:1.125rem}
.stat-card .stat-val{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;line-height:1}
.stat-card .stat-lbl{font-size:.6875rem;color:var(--t3);margin-top:.25rem}
/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8125rem}
th{background:var(--d);color:#fff;padding:.75rem;text-align:left;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:.625rem .75rem;border-bottom:1px solid #f1f5f9}
tr:hover{background:#f8fafc}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:.25rem .625rem;border-radius:999px;font-size:.6875rem;font-weight:600;white-space:nowrap}
.badge-green{background:#d1fae5;color:#065f46}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-purple{background:#ede9fe;color:#5b21b6}
/* Filters */
.filter-bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1rem}
.filter-bar label{font-size:.75rem;font-weight:500;color:var(--t3)}
.filter-bar input,.filter-bar select{height:2rem;padding:0 .625rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.75rem}
/* Session code */
.session-code{font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:700;letter-spacing:.15em;color:var(--b);text-align:center;background:#f8fafc;border:2px dashed var(--brd);border-radius:.75rem;padding:1rem}
/* Test section */
.test-card{border:1px solid var(--brd);border-radius:.75rem;padding:1rem}
.test-card h4{font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.radio-group{display:flex;gap:1rem}
.radio-option{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.radio-option input[type=radio]{width:1rem;height:1rem;accent-color:var(--b)}
.radio-option label{font-size:.875rem;font-weight:500;cursor:pointer}
.radio-option.in label{color:var(--grn)}
.radio-option.out label{color:var(--red)}
/* Mobile */
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:var(--w);border-bottom:1px solid var(--brd);padding:.75rem 1rem;align-items:center;justify-content:space-between}
.mobile-header .mob-logo{display:flex;align-items:center;gap:.5rem}
.mobile-header .mob-logo .icon{width:2rem;height:2rem;border-radius:.5rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.875rem}
.mobile-header .mob-logo span{font-weight:700;font-size:.8125rem}
.hamburger{background:none;font-size:1.25rem;padding:.25rem}
/* Report */
.report-card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.report-header{padding:2rem;border-bottom:1px solid #f1f5f9}
.report-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
.report-header p{color:var(--t3);font-size:.8125rem}
.report-body{padding:2rem}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem;border-radius:.5rem;border:1px solid var(--brd);margin-bottom:.5rem}
.result-row.pass{background:#f0fdf4;border-color:#bbf7d0}
.result-row.fail{background:#fef2f2;border-color:#fecaca}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:1rem;padding:1.5rem;width:100%;max-width:28rem;margin:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.modal h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.125rem;margin-bottom:1rem}
/* Print */
@media print{.no-print{display:none!important}body{background:#fff!important}.main{margin-left:0!important;padding:0!important}}
@media(max-width:768px){.sidebar{transform:translateX(-100%);width:16rem}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:1rem}.mobile-header{display:flex!important}.report-body{padding:1rem}}
</style>
</head>
<body>
<!-- ========== LOGIN PAGE ========== -->
<div id="page-login" class="page login-page active">
<div style="text-align:center;margin-bottom:2rem;color:#fff">
<div style="font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;margin-bottom:.5rem">Global Acqua</div>
<div style="font-size:.75rem;opacity:.6;letter-spacing:.1em;text-transform:uppercase">Sensory Quality Control</div>
</div>
<div class="login-card">
<div class="login-logo">💧</div>
<h1>Welcome back</h1>
<p>Sign in to access your sensory analysis dashboard</p>
<div id="login-error" class="err" style="display:none"></div>
<div class="field">
<label>Username</label>
<input type="text" id="login-user" placeholder="Enter username" autocomplete="username">
</div>
<div class="field">
<label>Password</label>
<input type="password" id="login-pass" placeholder="Enter password" autocomplete="current-password">
</div>
<button class="btn btn-primary btn-full" onclick="doLogin()" style="height:2.75rem">Sign In</button>
<div style="text-align:center;margin-top:1.5rem;font-size:.75rem;color:var(--t4)">
Developed by <b>Mr Saila Ruidas</b> in collaboration with <b>Emergent Lab</b>
</div>
</div>
</div>

<!-- ========== APP SHELL ========== -->
<div id="page-app" class="page">
<div class="mobile-header">
<div class="mob-logo"><div class="icon">💧</div><span>Global Acqua</span></div>
<button class="hamburger" onclick="toggleSidebar()">☰</button>
</div>
<aside class="sidebar" id="sidebar">
<div class="logo"><div class="icon">💧</div><div><h2>Global Acqua</h2><span id="sidebar-role-label">Panel</span></div></div>
<nav id="sidebar-nav"></nav>
<div class="user-box">
<div class="avatar" id="sidebar-avatar">A</div>
<div class="info"><div class="name" id="sidebar-name">Admin</div><div class="role" id="sidebar-role-text">Administrator</div></div>
<button class="btn btn-sm btn-secondary" onclick="doLogout()" style="margin-left:.5rem;font-size:.6875rem">Out</button>
</div>
</aside>
<div class="main" id="main-content"></div>
</div>

<!-- ========== MODAL ========== -->
<div class="modal-overlay" id="modal-overlay">
<div class="modal" id="modal-content"></div>
</div>

<script>
// ===== DATA LAYER =====
const DB = {
  _k: 'gaq_db',
  _load() { try { return JSON.parse(localStorage.getItem(this._k)) || { users:[], sessions:[], verifications:[] }; } catch { return { users:[], sessions:[] }; } },
  _save(d) { localStorage.setItem(this._k, JSON.stringify(d)); },
  init() {
    const d = this._load();
    if (!d.users.length) {
      d.users = [
        { id: uid(), username:'admin', password: hashPw('admin123'), role:'admin', createdAt: now() },
        { id: uid(), username:'Saila Ruidas', password: hashPw('saila123'), role:'admin', createdAt: now() },
        { id: uid(), username:'SD', password: hashPw('sd123'), role:'user', createdAt: now() },
        { id: uid(), username:'RM', password: hashPw('rm123'), role:'user', createdAt: now() },
        { id: uid(), username:'SC', password: hashPw('sc123'), role:'user', createdAt: now() },
        { id: uid(), username:'SM', password: hashPw('sm123'), role:'user', createdAt: now() },
      ];
      this._save(d);
    }
    return d;
  },
  getUsers() { return this._load().users.map(u => ({...u, password:undefined})); },
  findUser(u,p) { const d=this._load(); return d.users.find(x=>x.username===u && verifyPw(p,x.password)); },
  addUser(u,p,r) { const d=this._load(); if(d.users.find(x=>x.username===u)) return false; d.users.push({id:uid(),username:u,password:hashPw(p),role:r,createdAt:now()}); this._save(d); return true; },
  deleteUser(u) { const d=this._load(); d.users=d.users.filter(x=>x.username!==u); this._save(d); },
  getSessions(role,user) { const d=this._load(); return role==='admin'?d.sessions:d.sessions.filter(s=>s.createdBy===user); },
  getAllSessions() { return this._load().sessions; },
  findSession(code) { return this._load().sessions.find(s=>s.sessionCode===code); },
  createSession(code,count,type,user) { const d=this._load(); const s={id:uid(),sessionCode:code,status:'in_progress',targetPanelistCount:count,testType:type,ballots:[],createdBy:user,createdAt:now(),completedAt:null,verifiedBy:null,verifiedByName:null,verificationSignature:null}; d.sessions.push(s); this._save(d); return s; },
  submitBallot(code,ballot) { const d=this._load(); const s=d.sessions.find(x=>x.sessionCode===code); if(!s) return null; s.ballots.push(ballot); if(s.ballots.length>=s.targetPanelistCount){s.status='completed';s.completedAt=now();} this._save(d); return s; },
  deleteSession(code) { const d=this._load(); d.sessions=d.sessions.filter(x=>x.sessionCode!==code); this._save(d); },
  verifySession(code,name,sig) { const d=this._load(); const s=d.sessions.find(x=>x.sessionCode===code); if(s){s.verifiedBy='verified';s.verifiedByName=name;s.signature=sig;this._save(d);} },
};

// ===== HELPERS =====
function uid() { return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36); }
function now() { return new Date().toISOString(); }
function hashPw(p) { let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return 'h'+h; }
function verifyPw(p,h) { return hashPw(p)===h; }
function fmtDate(s){return s?new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'N/A';}
function fmtDateTime(s){return s?new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'N/A';}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal-overlay').classList.add('show');}
function hideModal(){document.getElementById('modal-overlay').classList.remove('show');}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)hideModal();});

// ===== STATE =====
let currentUser = null;
let currentView = 'dashboard';

// ===== AUTH =====
function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const user = DB.findUser(u,p);
  if (!user) { document.getElementById('login-error').textContent='Incorrect username or password'; document.getElementById('login-error').style.display='block'; return; }
  currentUser = { username:user.username, role:user.role };
  document.getElementById('login-error').style.display='none';
  showApp();
}
function doLogout() { currentUser=null; currentView='dashboard'; document.getElementById('page-app').classList.remove('active'); document.getElementById('page-login').classList.add('active'); document.getElementById('login-user').value=''; document.getElementById('login-pass').value=''; }
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('login-user').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login-pass').focus();});

// ===== APP SHELL =====
function showApp() {
  document.getElementById('page-login').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
  document.getElementById('sidebar-name').textContent=currentUser.username;
  document.getElementById('sidebar-avatar').textContent=currentUser.username.charAt(0).toUpperCase();
  if(currentUser.role==='admin'){document.getElementById('sidebar-role-label').textContent='Admin Panel';document.getElementById('sidebar-role-text').textContent='Administrator';}
  else{document.getElementById('sidebar-role-label').textContent='Sensory Panel';document.getElementById('sidebar-role-text').textContent='Panelist';}
  buildNav();
  navigateTo('dashboard');
}
function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  if(currentUser.role==='admin'){
    nav.innerHTML=`
      <a onclick="navigateTo('dashboard')" id="nav-dashboard">📊 Dashboard</a>
      <a onclick="navigateTo('users')" id="nav-users">👥 User Management</a>
      <a onclick="navigateTo('sessions')" id="nav-sessions">📋 All Sessions</a>
      <a onclick="navigateTo('generate')" id="nav-generate">🔑 Generate Code</a>
      <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)">
        <div style="font-size:.625rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;padding:0 1rem;margin-bottom:.5rem">Reports</div>
        <a onclick="openReport('daily')">📅 Daily Summary</a>
        <a onclick="openReport('blind')">🎯 Blind Test Summary</a>
        <a onclick="openReport('proficiency')">⭐ Proficiency Summary</a>
      </div>`;
  } else {
    nav.innerHTML=`
      <a onclick="navigateTo('dashboard')" id="nav-dashboard">📊 Dashboard</a>
      <a onclick="navigateTo('active')" id="nav-active">📋 Active Session</a>`;
  }
}
function navigateTo(view) {
  currentView=view;
  document.querySelectorAll('.sidebar nav a').forEach(a=>a.classList.remove('active'));
  const el=document.getElementById('nav-'+view); if(el) el.classList.add('active');
  renderView();
  document.getElementById('sidebar').classList.remove('open');
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

// ===== RENDER =====
function renderView() {
  const m = document.getElementById('main-content');
  switch(currentView) {
    case 'dashboard': m.innerHTML = currentUser.role==='admin'?renderAdminDash():renderUserDash(); break;
    case 'users': m.innerHTML=renderUsers(); break;
    case 'sessions': m.innerHTML=renderSessions(); break;
    case 'generate': m.innerHTML=renderGenerate(); break;
    case 'active': m.innerHTML=renderActive(); break;
    case 'ballot': m.innerHTML=renderBallot(); break;
    case 'report': m.innerHTML=renderSessionReport(); break;
    default: m.innerHTML=renderUserDash();
  }
}

// ===== ADMIN DASHBOARD =====
function renderAdminDash() {
  const sessions=DB.getAllSessions();
  const today=new Date().toDateString();
  const completed=sessions.filter(s=>s.status==='completed');
  const todayCount=completed.filter(s=>s.createdAt&&new Date(s.createdAt).toDateString()===today).length;
  const ballotsCount=sessions.reduce((a,s)=>a+s.ballots.length,0);
  return `
  <div class="main-header"><h1>Admin Dashboard</h1><p>Welcome, ${escH(currentUser.username)}</p></div>
  <div class="grid grid-4" style="margin-bottom:2rem">
    <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:var(--b)">📊</div><div><div class="stat-val">${sessions.length}</div><div class="stat-lbl">Total Sessions</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4;color:var(--grn)">✅</div><div><div class="stat-val">${completed.length}</div><div class="stat-lbl">Completed</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#fffbeb;color:var(--amb)">📋</div><div><div class="stat-val">${todayCount}</div><div class="stat-lbl">Today</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#f5f3ff;color:var(--pur)">👥</div><div><div class="stat-val">${ballotsCount}</div><div class="stat-lbl">Ballots</div></div></div>
  </div>
  <div class="grid grid-2">

let _activeCode='',_ballotNum=1,_ballotInitial=null,_selectedTest='regular';
function startSession(count,testType='regular') {
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='GAQ-';for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];
  DB.createSession(c,count,testType,currentUser.username);
  _activeCode=c;_ballotNum=1;_ballotInitial=null;_selectedTest=testType;
  currentView='ballot';renderView();
}
function joinSession() {
  const code=(_joinCode||document.getElementById('join-code-input')?.value||'').trim().toUpperCase();
  if(!code){alert('Enter a session code');return;}
  const s=DB.findSession(code);if(!s){alert('Session not found');return;}
  if(s.status==='completed'){alert('Session is completed');return;}
  _activeCode=code;_ballotNum=s.ballots.length+1;_selectedTest=s.testType||'regular';
  if(s.ballots.length>0){const f=s.ballots[0];_ballotInitial={productType:f.productType,otherProductType:f.otherProductType,productVariant:f.productVariant,otherProductVariant:f.otherProductVariant,productCode:f.productCode,dateOfMfg:f.dateOfMfg,controlSampleCode:f.controlSampleCode,productTime:f.productTime};}
  else{_ballotInitial=null;}
  _joinCode='';currentView='ballot';renderView();
}
function viewSession(code) {
  const s=DB.findSession(code);if(!s){alert('Not found');return;}
  _viewingSession=s;currentView='report';renderView();
}

function submitBallot(data) {
  data.signature=data.signature||null;

  else{_ballotNum=updated.ballots.length+1;if(updated.ballots.length===1&&_selectedTest==='regular'){_ballotInitial={productType:data.productType,otherProductType:data.otherProductType,productVariant:data.productVariant,otherProductVariant:data.otherProductVariant,productCode:data.productCode,dateOfMfg:data.dateOfMfg,controlSampleCode:data.controlSampleCode,productTime:data.productTime};}renderView();alert(`Ballot submitted! Waiting for ${updated.targetPanelistCount-updated.ballots.length} more.`);}
}

function submitRegularBallot(form) {
  const fd=new FormData(form);
  const d={panelistName:fd.get('panelistName'),productType:fd.get('productType'),otherProductType:fd.get('otherProductType')||'',productVariant:fd.get('productVariant')||'',otherProductVariant:fd.get('otherProductVariant')||'',productCode:fd.get('productCode'),dateOfMfg:fd.get('dateOfMfg'),controlSampleCode:fd.get('controlSampleCode'),productTime:fd.get('productTime'),testingCompletionDate:fd.get('completionDate'),testingCompletionTime:fd.get('completionTime'),remarks:fd.get('remarks')||'',appearance:{status:fd.get('appearance'),reason:fd.get('appearanceReason')||'',otherReason:''},odour:{status:fd.get('odour'),reason:fd.get('odourReason')||'',otherReason:''},taste:{status:fd.get('taste')||'IN',reason:fd.get('tasteReason')||'',otherReason:''}};
  if(d.productType==='Raw Water')d.taste={status:'IN',reason:'',otherReason:''};
  submitBallot(d);
}
function renderBlindBallot(s) {
  const i=_ballotInitial||{};const now=new Date();const cd=now.toISOString().split('T')[0];const ct=now.toTimeString().slice(0,5);
  const colors=['Control','Yellow','Brown','Blue','Green','Red','Purple'];
  return `<form onsubmit="event.preventDefault();submitBlindBallot(this)">
    <div class="card" style="margin-bottom:1rem"><div class="card-body">
      <div class="grid grid-2"><div class="field"><label>Panelist Name *</label><input name="panelistName" required></div><div class="field"><label>Test Code</label><input name="testCode"></div>
      <div class="field"><label>Test Date *</label><input name="testDate" type="date" required value="${cd}"></div><div class="field"><label>Test Time *</label><input name="testTime" type="time" required value="${ct}"></div>
      <div class="field"><label>Round No *</label><input name="roundNo" required value="1"></div><div class="field"><label>Provider</label><input name="provider" placeholder="e.g., PepsiCo"></div></div>
    </div></div>
    <div class="card" style="margin-bottom:1rem"><div class="card-header"><h3>🎯 Sample Evaluation</h3></div><div class="card-body">
      <p style="font-size:.75rem;color:var(--t3);margin-bottom:1rem">Evaluate each sample and mark IN/OUT</p>
      ${colors.map((c,ci)=>`<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:.5rem;margin-bottom:.5rem;align-items:center;padding:.5rem;border:1px solid var(--brd);border-radius:.5rem">
        <span class="badge" style="background:${c==='Control'?'#e5e7eb':c==='Yellow'?'#fef08a':c==='Brown'?'#a16207':c==='Blue'?'#3b82f6':c==='Green'?'#22c55e':c==='Red'?'#ef4444':'#a855f7'};color:${c==='Control'||c==='Yellow'||c==='Green'?'#000':'#fff'};font-weight:700">${c}</span>
        <select name="sample_${ci}_status"><option value="IN">IN</option><option value="OUT">OUT</option></select>
        <input name="sample_${ci}_offNote" placeholder="OFF Note (if OUT)">
      </div>`).join('')}
    </div></div>
    <button type="submit" class="btn btn-primary btn-full" style="height:3rem">✅ Submit Blind Test</button>
  </form>`;
}
function submitBlindBallot(form) {
  const fd=new FormData(form);const colors=['Control','Yellow','Brown','Blue','Green','Red','Purple'];
  const samples=colors.map((c,i)=>({colorCode:c,status:fd.get(`sample_${i}_status`),offNote:fd.get(`sample_${i}_offNote`)||''}));
  submitBallot({panelistName:fd.get('panelistName'),testCode:fd.get('testCode'),testDate:fd.get('testDate'),testTime:fd.get('testTime'),roundNo:fd.get('roundNo'),provider:fd.get('provider'),samples});
}
function renderProfBallot(s) {
  const i=_ballotInitial||{};const now=new Date();const cd=now.toISOString().split('T')[0];const ct=now.toTimeString().slice(0,5);
  return `<form onsubmit="event.preventDefault();submitBlindBallot(this)">
    <div class="card" style="margin-bottom:1rem"><div class="card-body">
      <div class="grid grid-2"><div class="field"><label>Panelist Name *</label><input name="panelistName" required></div><div class="field"><label>Test Code</label><input name="testCode"></div>
      <div class="field"><label>Test Date *</label><input name="testDate" type="date" required value="${cd}"></div><div class="field"><label>Test Time *</label><input name="testTime" type="time" required value="${ct}"></div>
      <div class="field"><label>Round No *</label><input name="roundNo" required value="1"></div><div class="field"><label>Provider</label><input name="provider"></div></div>
    </div></div>
    <div class="card" style="margin-bottom:1rem"><div class="card-header"><h3>⭐ Proficiency Samples</h3></div><div class="card-body">
      ${['Control','Yellow','Brown','Blue','Green','Red','Purple'].map((c,ci)=>`<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:.5rem;margin-bottom:.5rem;align-items:center;padding:.5rem;border:1px solid var(--brd);border-radius:.5rem">
        <span class="badge" style="background:${c==='Control'?'#e5e7eb':c==='Yellow'?'#fef08a':c==='Brown'?'#a16207':c==='Blue'?'#3b82f6':c==='Green'?'#22c55e':c==='Red'?'#ef4444':'#a855f7'};color:${c==='Control'||c==='Yellow'||c==='Green'?'#000':'#fff'};font-weight:700">${c}</span>
        <select name="sample_${ci}_status"><option value="IN">IN</option><option value="OUT">OUT</option></select>
        <input name="sample_${ci}_offNote" placeholder="OFF Note">
      </div>`).join('')}
    </div></div>
    <button type="submit" class="btn btn-primary btn-full" style="height:3rem">✅ Submit Proficiency Test</button>
  </form>`;
}

// ===== REPORT VIEW =====
function renderSessionReport() {
  const s=_viewingSession;if(!s) return '<p>No session</p>';
  const ballots=s.ballots||[];const total=s.targetPanelistCount;const pct=Math.min(100,Math.round((ballots.length/total)*100));
  const isBlind=s.testType==='blind'||s.testType==='proficiency';
  let checks=0,ins=0;const cat={Appearance:{i:0,t:0},Odour:{i:0,t:0},Taste:{i:0,t:0}};
  ballots.forEach(b=>{['appearance','odour','taste'].forEach(k=>{if(b[k]&&b[k].status){cat[k==='appearance'?'Appearance':k==='odour'?'Odour':'Taste'].t++;checks++;if(b[k].status==='IN'){cat[k==='appearance'?'Appearance':k==='odour'?'Odour':'Taste'].i++;ins++;}}});});
  const passPct=checks?Math.round((ins/checks)*100):null;
  const allPassed=passPct===100;
  return `<div style="max-width:50rem;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <button class="btn btn-sm btn-secondary" onclick="navigateTo('dashboard')">← Dashboard</button>
      <button class="btn btn-sm btn-primary" onclick="window.print()">🖨️ Print</button>
    </div>
    <div class="grid grid-3" style="margin-bottom:1.5rem">
      <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:var(--b)">👥</div><div><div class="stat-val">${ballots.length}/${total}</div><div class="stat-lbl">Panelists (${pct}%)</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:${allPassed?'#f0fdf4':'#fef2f2'};color:${allPassed?'var(--grn)':'var(--red)'}">${allPassed?'✅':'⚠️'}</div><div><div class="stat-val" style="color:${allPassed?'var(--grn)':'var(--red)'}">${passPct!==null?passPct+'%':'—'}</div><div class="stat-lbl">Quality Rate</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#f5f3ff;color:var(--pur)">📋</div><div><div class="stat-val">${s.testType||'regular'}</div><div class="stat-lbl">Test Type</div></div></div>
    </div>
    <div class="report-card">
      <div class="report-header">
        <h1>${s.testType==='blind'?'Sensory Blind Test Report':s.testType==='proficiency'?'Proficiency Test Report':'Sensory Evaluation Report'}</h1>
        <p>Global Acqua Pvt Ltd &middot; Sensory Quality Control</p>
        <div style="display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap">
          <div class="badge badge-blue" style="font-family:'Space Grotesk',monospace;font-size:.875rem;padding:.5rem 1rem">${s.sessionCode}</div>
          <div style="font-size:.8125rem;color:var(--t3)">Completed: ${fmtDateTime(s.completedAt||s.createdAt)}</div>
        </div>
      </div>
      <div class="report-body">
        ${Object.entries(cat).filter(([,v])=>v.t>0).map(([name,v])=>{const p=Math.round((v.i/v.t)*100);return `<div style="margin-bottom:.75rem"><div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.25rem"><span style="font-weight:600">${name}</span><span style="color:${p===100?'var(--grn)':'var(--b)'};font-weight:700">${p}% IN (${v.i}/${v.t})</span></div><div style="height:.5rem;background:#f1f5f9;border-radius:999px;overflow:hidden"><div style="height:100%;width:${p}%;background:${p===100?'var(--grn)':'var(--b)'};border-radius:999px"></div></div></div>`;}).join('')}
        <h3 style="font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;margin:1.5rem 0 1rem;color:var(--t2)">Panelist Evaluations</h3>
        ${ballots.map((b,idx)=>`<div style="border:1px solid var(--brd);border-radius:.75rem;margin-bottom:1rem;overflow:hidden">
          <div style="background:${isBlind?'#f5f3ff':'#eff6ff'};padding:.75rem 1rem;border-bottom:1px solid ${isBlind?'#ede9fe':'#dbeafe'};display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:.5rem"><span style="width:1.75rem;height:1.75rem;background:${isBlind?'var(--pur)':'var(--b)'};color:#fff;border-radius:.375rem;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700">${idx+1}</span><span style="font-weight:600">${escH(b.panelistName||'Panelist '+(idx+1))}</span></div>
            ${b.testingCompletionDate?`<span style="font-size:.6875rem;color:var(--t3)">${b.testingCompletionDate} ${b.testingCompletionTime||''}</span>`:''}
          </div>
          <div style="padding:1rem">
            ${isBlind&&b.samples?`<table style="width:100%"><thead><tr style="background:#fafbfc"><th style="font-size:.625rem">Sl</th><th style="font-size:.625rem">Color Code</th><th style="font-size:.625rem">Result</th><th style="font-size:.625rem">OFF Note</th></tr></thead><tbody>${b.samples.map((s,si)=>`<tr><td>${s.colorCode==='Control'?'Ctrl':si}</td><td><span class="badge" style="background:${s.colorCode==='Control'?'#e5e7eb':s.colorCode==='Yellow'?'#fef08a':s.colorCode==='Brown'?'#a16207':s.colorCode==='Blue'?'#3b82f6':s.colorCode==='Green'?'#22c55e':s.colorCode==='Red'?'#ef4444':'#a855f7'};color:${s.colorCode==='Control'||s.colorCode==='Yellow'||s.colorCode==='Green'?'#000':'#fff'}">${s.colorCode}</span></td><td><span class="badge ${s.status==='IN'?'badge-green':'badge-red'}">${s.colorCode==='Control'?'IN (Ctrl)':s.status}</span></td><td>${s.colorCode==='Control'?'N/A':(s.offNote||'-')}</td></tr>`).join('')}</tbody></table>`
            :`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.5rem;margin-bottom:.75rem">
              ${b.productType?`<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Type</div><div style="font-size:.8125rem;font-weight:600">${escH(b.productType==='Other'?b.otherProductType:b.productType)}</div></div>`:''}
              ${b.productCode?`<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Code</div><div style="font-size:.8125rem;font-weight:600;font-family:monospace">${escH(b.productCode)}</div></div>`:''}
              ${b.dateOfMfg?`<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Mfg Date</div><div style="font-size:.8125rem;font-weight:600">${b.dateOfMfg}</div></div>`:''}
            </div>
            ${['appearance','odour'].concat(b.productType!=='Raw Water'?['taste']:[]).filter(k=>b[k]).map(k=>`<div class="result-row ${b[k].status==='IN'?'pass':'fail'}"><span style="font-size:.8125rem;font-weight:500">${k.charAt(0).toUpperCase()+k.slice(1)}</span><div style="display:flex;align-items:center;gap:.5rem"><span class="badge ${b[k].status==='IN'?'badge-green':'badge-red'}">${b[k].status}</span>${b[k].status==='OUT'?`<span style="font-size:.75rem;color:var(--red)">${escH(b[k].reason==='Other'?'Other':b[k].reason)}</span>`:''}</div></div>`).join('')}
            ${b.remarks?`<div style="margin-top:.5rem;background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Remarks</div><div style="font-size:.8125rem">${escH(b.remarks)}</div></div>`:''}
            ${b.signature?`<div style="margin-top:.5rem;text-align:right"><img src="${b.signature}" style="height:2.5rem;border:1px solid var(--brd);border-radius:.375rem;background:#fff;padding:.25rem"></div>`:''}
          `}
          </div>
        </div>`).join('')}
        <div style="text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid #f1f5f9;font-size:.75rem;color:var(--t4)">Generated by <b>Global Acqua Pvt Ltd</b> &middot; Sensory Analysis System</div>
      </div>
    </div>
  </div>`;
}

// ===== ACTIVE SESSION VIEW =====
function renderActive() {
  const s=DB.findSession(_activeCode);if(!s) return '<p>No active session. <a href="#" onclick="navigateTo(\'dashboard\');return false" style="color:var(--b)">Go to Dashboard</a></p>';
  if(s.status==='completed'){_viewingSession=s;currentView='report';return renderSessionReport();}
  currentView='ballot';return renderBallot();
}

// ===== ADMIN REPORTS =====
function openReport(type) {
  const today=new Date().toISOString().split('T')[0];
  const sessions=DB.getAllSessions();
  const regular=sessions.filter(s=>(!s.testType||s.testType==='regular')&&s.status==='completed');
  const html=`<div class="card" style="max-width:50rem;margin:0 auto">
    <div class="card-header"><span style="font-size:1.25rem">📅</span><h3>${type==='daily'?'Daily Summary':type==='blind'?'Blind Test Summary':'Proficiency Summary'} — ${fmtDate(today)}</h3></div>
    <div class="card-body"><div class="table-wrap"><table style="width:100%"><thead><tr><th>Code</th><th>Product</th><th>Code</th><th>Panelists</th><th>Result</th><th>Date</th></tr></thead><tbody>
    ${regular.map(s=>{const b=s.ballots[0]||{};const allIn=s.ballots.every(x=>x.appearance?.status==='IN'&&x.odour?.status==='IN'&&(x.taste?.status==='IN'||x.productType==='Raw Water'));return `<tr><td style="font-family:monospace;font-weight:700;color:var(--b)">${s.sessionCode}</td><td>${escH(b.productType==='Other'?b.otherProductType:b.productType)}</td><td>${escH(b.productCode)}</td><td>${s.ballots.length}/${s.targetPanelistCount}</td><td><span class="badge ${allIn?'badge-green':'badge-red'}">${allIn?'IN':'OUT'}</span></td><td>${fmtDate(s.completedAt)}</td></tr>`;}).join('')}
    ${regular.length===0?'<tr><td colspan="6" style="text-align:center;color:var(--t4);padding:2rem">No completed sessions yet</td></tr>':''}
    </tbody></table></div></div></div>`;
  showModal(html);
}

// ===== INIT =====
DB.init();
</script>
</body>
</html>
