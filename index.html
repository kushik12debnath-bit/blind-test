<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Acqua - Sensory Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--d:#0a1628;--n:#0d2137;--b:#0064C8;--s:#009DE0;--g:#f0f4f8;--w:#fff;--t1:#1a202c;--t2:#4a5568;--t3:#718096;--t4:#a0aec0;--brd:#e2e8f0;--red:#dc2626;--grn:#059669;--amb:#d97706;--pur:#7c3aed}
body{font-family:'Inter',sans-serif;background:var(--g);color:var(--t1);line-height:1.6}
input,select,textarea,button{font-family:inherit}button{cursor:pointer;border:none}
input:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 3px rgba(0,100,200,.1)}
.page{display:none;min-height:100vh}.page.active{display:flex}
.login-page{background:linear-gradient(160deg,var(--d),#0f3460);align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--w);border-radius:1.25rem;padding:2.5rem;width:100%;max-width:26rem;box-shadow:0 25px 60px -12px rgba(0,0,0,.4)}
.login-logo{width:3rem;height:3rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;font-size:1.5rem;color:#fff}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.625rem;font-weight:700;margin-bottom:.25rem}
.login-card p{color:var(--t3);font-size:.875rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}.field label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.375rem}
.field input,.field select,.field textarea{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.875rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:.625rem;font-weight:600;font-size:.875rem;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--b),var(--s));color:#fff}.btn-primary:hover{transform:translateY(-1px)}.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--w);color:var(--t2);border:1px solid var(--brd)}.btn-secondary:hover{background:#f7fafc}
.btn-sm{padding:.375rem .75rem;font-size:.75rem;border-radius:.5rem}.btn-full{width:100%}.btn-danger{background:#fee2e2;color:var(--red);border:1px solid #fecaca}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:.5rem;padding:.75rem;color:var(--red);font-size:.8125rem;margin-bottom:1rem}
.sidebar{width:16rem;background:linear-gradient(180deg,var(--d),var(--n) 50%,#0f3460);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40}
.sidebar .logo{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .logo .icon{width:2.5rem;height:2.5rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.sidebar .logo h2{font-family:'Space Grotesk',sans-serif;font-size:1.125rem;font-weight:700}
.sidebar .logo span{font-size:.625rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em}
.sidebar nav{flex:1;padding:1rem;display:flex;flex-direction:column;gap:.25rem;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:rgba(255,255,255,.5);transition:all .2s;cursor:pointer}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:#fff}
.sidebar .user-box{padding:1rem;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .avatar{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.sidebar .info{flex:1}.sidebar .name{font-size:.8125rem;font-weight:500}.sidebar .role{font-size:.625rem;color:rgba(255,255,255,.5)}
.main{flex:1;margin-left:16rem;padding:2rem}
.main-header{margin-bottom:2rem}.main-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}.main-header p{font-size:.8125rem;color:var(--t3)}
.card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:.75rem;background:#fafbfc}
.card-header h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.875rem}
.card-body{padding:1.5rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--w);border:1px solid var(--brd);border-radius:.75rem;padding:1.25rem;display:flex;align-items:center;gap:.75rem}
.si{width:2.5rem;height:2.5rem;border-radius:.625rem;display:flex;align-items:center;justify-content:center;font-size:1.125rem}
.sv{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;line-height:1}.sl{font-size:.6875rem;color:var(--t3);margin-top:.25rem}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8125rem}
th{background:var(--d);color:#fff;padding:.75rem;text-align:left;font-size:.6875rem;font-weight:600;text-transform:uppercase;white-space:nowrap}
td{padding:.625rem .75rem;border-bottom:1px solid #f1f5f9}tr:hover{background:#f8fafc}
.badge{display:inline-flex;padding:.25rem .625rem;border-radius:999px;font-size:.6875rem;font-weight:600}
.bg{background:#d1fae5;color:#065f46}.br{background:#fee2e2;color:#991b1b}.bb{background:#dbeafe;color:#1e40af}.ba{background:#fef3c7;color:#92400e}.bp{background:#ede9fe;color:#5b21b6}
.session-code-box{font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:700;letter-spacing:.15em;color:var(--b);text-align:center;background:#f8fafc;border:2px dashed var(--brd);border-radius:.75rem;padding:1rem}
.test-card{border:1px solid var(--brd);border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.test-card h4{font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.report-card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.report-header{padding:2rem;border-bottom:1px solid #f1f5f9}.report-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
.report-body{padding:2rem}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem;border-radius:.5rem;border:1px solid var(--brd);margin-bottom:.5rem}
.result-row.pass{background:#f0fdf4;border-color:#bbf7d0}.result-row.fail{background:#fef2f2;border-color:#fecaca}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:1rem;padding:1.5rem;width:100%;max-width:40rem;margin:1rem;max-height:90vh;overflow-y:auto}
.toast{position:fixed;top:1rem;right:1rem;z-index:200;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:#fff;box-shadow:0 8px 30px -5px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}.toast.ok{background:#059669}.toast.err2{background:#dc2626}.toast.inf{background:#0064C8}
.debug-panel{background:#1a1a2e;color:#0f0;border-radius:.5rem;padding:1rem;font-family:monospace;font-size:.7rem;max-height:200px;overflow-y:auto;margin-top:1rem;white-space:pre-wrap}
.code-link{font-family:monospace;font-weight:700;color:var(--b);cursor:pointer;text-decoration:underline}
.code-link:hover{color:var(--s)}
@media print{.main{margin-left:0!important;padding:0!important}}
@media(max-width:768px){.g2,.g3,.g4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);width:16rem}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:1rem}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div id="page-login" class="page login-page active">
  <div style="text-align:center;margin-bottom:2rem;color:#fff">
    <div style="font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700">Global Acqua</div>
    <div style="font-size:.75rem;opacity:.6;letter-spacing:.1em;text-transform:uppercase">Sensory Quality Control</div>
  </div>
  <div class="login-card">
    <div class="login-logo">W</div>
    <h1>Welcome back</h1>
    <p>Sign in to access your dashboard</p>
    <div id="login-error" class="err" style="display:none"></div>
    <div class="field"><label>Username</label><input type="text" id="login-user" placeholder="Enter username"></div>
    <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="Enter password"></div>
    <button class="btn btn-primary btn-full" id="login-btn" style="height:2.75rem">Sign In</button>
    <div style="margin-top:1rem;padding:.75rem;background:#f0f4f8;border-radius:.5rem;font-size:.6875rem;color:var(--t3)">
      <b>Demo Accounts:</b><br>Admin: admin / admin123<br>User: SD / sd123<br>User: RM / rm123
    </div>
  </div>
</div>

<div id="page-app" class="page">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><div class="icon">W</div><div><h2>Global Acqua</h2><span id="sr-label">Panel</span></div></div>
    <nav id="snav"></nav>
    <div class="user-box">
      <div class="avatar" id="savatar">A</div>
      <div class="info"><div class="name" id="sname">Admin</div><div class="role" id="srole">Administrator</div></div>
      <button class="btn btn-sm" id="logout-btn" style="color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)">Out</button>
    </div>
  </aside>
  <div class="main" id="mc"></div>
</div>

<div class="modal-overlay" id="mover"><div class="modal" id="mcont"></div></div>

<script>
"use strict";

// ========== STORAGE ==========
// Use ONE consistent key. Also migrate from any old keys.
var SK = "global_aqua_data";

function dbLoad() {
  // Try current key
  try {
    var d = JSON.parse(localStorage.getItem(SK));
    if (d && d.users && d.users.length >= 1) return d;
  } catch(e) {}
  // Try ALL known old keys
  var oldKeys = ["gaq_data", "gaq_db", "gaq"];
  for (var k = 0; k < oldKeys.length; k++) {
    try {
      var old = JSON.parse(localStorage.getItem(oldKeys[k]));
      if (old && old.users && old.users.length >= 1) {
        // Migrate to new key
        localStorage.setItem(SK, JSON.stringify(old));
        localStorage.removeItem(oldKeys[k]);
        return old;
      }
    } catch(e) {}
  }
  // Nothing found - will init fresh
  return { users: [], sessions: [] };
}

function dbSave(d) {
  localStorage.setItem(SK, JSON.stringify(d));
}

function dbClear() {
  localStorage.removeItem(SK);
  ["gaq_data", "gaq_db", "gaq"].forEach(function(k) { localStorage.removeItem(k); });
}

// ========== HELPERS ==========
function $(id) { return document.getElementById(id); }
function hash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h | 0; }
  return "h" + h;
}
function uid() { return "x" + Math.random().toString(36).slice(2) + Date.now().toString(36); }
function iso() { return new Date().toISOString(); }
function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmtD(s) { return s ? new Date(s).toLocaleDateString("en-US", {year:"numeric",month:"short",day:"numeric"}) : "N/A"; }
function fmtDT(s) { return s ? new Date(s).toLocaleDateString("en-US", {year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "N/A"; }
function toast(m, t) {
  var el = $("toast");
  el.textContent = m;
  el.className = "toast " + (t === "error" ? "err2" : t === "info" ? "inf" : "ok") + " show";
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove("show"); }, 3500);
}
function genCode() {
  var A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", c = "GAQ-";
  for (var i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}
function sc(i, c, b, v, l) {
  return '<div class="stat-card"><div class="si" style="background:' + b + ';color:' + c + '">' + i + '</div><div><div class="sv">' + v + '</div><div class="sl">' + l + '</div></div></div>';
}

// ========== DB INIT ==========
function dbInit() {
  var d = dbLoad();
  if (!d.users || !d.users.length) {
    d.users = [
      { id: uid(), username: "admin", password: hash("admin123"), role: "admin", createdAt: iso() },
      { id: uid(), username: "Saila Ruidas", password: hash("saila123"), role: "admin", createdAt: iso() },
      { id: uid(), username: "SD", password: hash("sd123"), role: "user", createdAt: iso() },
      { id: uid(), username: "RM", password: hash("rm123"), role: "user", createdAt: iso() },
      { id: uid(), username: "SC", password: hash("sc123"), role: "user", createdAt: iso() },
      { id: uid(), username: "SM", password: hash("sm123"), role: "user", createdAt: iso() }
    ];
    d.sessions = [];
    dbSave(d);
  }
  if (!d.sessions) { d.sessions = []; dbSave(d); }
}

// ========== STATE ==========
var U = null, V = "dashboard";
var AC = "", BN = 1, BI = null, ST = "regular", VS = null;
var TS = false, JC = "";
var SS = "", SF = "", STO = "", SST = "all";
var GT = "regular", GC = "3", GV = "";

// ========== AUTH ==========
function doLogin() {
  var u = $("login-user").value.trim();
  var p = $("login-pass").value;
  if (!u || !p) { $("login-error").textContent = "Enter username and password"; $("login-error").style.display = "block"; return; }
  var d = dbLoad();
  var found = null;
  for (var i = 0; i < d.users.length; i++) {
    if (d.users[i].username === u && d.users[i].password === hash(p)) { found = d.users[i]; break; }
  }
  if (!found) { $("login-error").textContent = "Incorrect username or password"; $("login-error").style.display = "block"; return; }
  $("login-error").style.display = "none";
  U = { username: found.username, role: found.role };
  showApp();
}

function doLogout() {
  U = null; V = "dashboard";
  $("page-app").classList.remove("active");
  $("page-login").classList.add("active");
  $("login-user").value = "";
  $("login-pass").value = "";
}

function showApp() {
  $("page-login").classList.remove("active");
  $("page-app").classList.add("active");
  $("sname").textContent = U.username;
  $("savatar").textContent = U.username.charAt(0).toUpperCase();
  $("sr-label").textContent = U.role === "admin" ? "Admin Panel" : "Sensory Panel";
  $("srole").textContent = U.role === "admin" ? "Administrator" : "Panelist";
  buildNav();
  navTo("dashboard");
  toast("Welcome, " + U.username + "!", "ok");
}

// ========== NAV ==========
function buildNav() {
  var n = $("snav");
  if (U.role === "admin") {
    n.innerHTML =
      '<a data-nav="dashboard">Dashboard</a>' +
      '<a data-nav="users">User Management</a>' +
      '<a data-nav="sessions">All Sessions</a>' +
      '<a data-nav="generate">Generate Code</a>' +
      '<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)">' +
      '<div style="font-size:.625rem;color:rgba(255,255,255,.4);text-transform:uppercase;padding:0 1rem;margin-bottom:.5rem">Reports</div>' +
      '<a data-rpt="daily">Daily Summary</a>' +
      '<a data-rpt="blind">Blind Test Summary</a>' +
      '<a data-rpt="proficiency">Proficiency Summary</a></div>';
  } else {
    n.innerHTML = '<a data-nav="dashboard">Dashboard</a><a data-nav="active">Active Session</a>';
  }
  n.querySelectorAll("a").forEach(function(a) {
    a.addEventListener("click", function() {
      var nav = a.getAttribute("data-nav");
      var rpt = a.getAttribute("data-rpt");
      if (nav) navTo(nav);
      else if (rpt) openRpt(rpt);
    });
  });
}

function navTo(v) {
  V = v;
  document.querySelectorAll(".sidebar nav a").forEach(function(a) { a.classList.remove("active"); });
  var el = document.querySelector('.sidebar nav a[data-nav="' + v + '"]');
  if (el) el.classList.add("active");
  render();
}

// ========== RENDER ==========
function render() {
  var m = $("mc");
  switch (V) {
    case "dashboard": m.innerHTML = U.role === "admin" ? rAdmin() : rUser(); break;
    case "users": m.innerHTML = rUsers(); break;
    case "sessions": m.innerHTML = rSessions(); break;
    case "generate": m.innerHTML = rGen(); break;
    case "active": m.innerHTML = rActive(); break;
    case "ballot": m.innerHTML = rBallot(); break;
    case "report": m.innerHTML = rReport(); break;
    default: m.innerHTML = U.role === "admin" ? rAdmin() : rUser();
  }
  wireDynamic();
}

// ========== WIRE DYNAMIC ==========
function wireDynamic() {
  var jci = $("jci");
  var jbtn = $("jbtn");
  if (jci && jbtn) {
    jci.addEventListener("input", function() { JC = this.value.toUpperCase(); jbtn.disabled = !JC.trim(); });
    jci.addEventListener("keydown", function(e) { if (e.key === "Enter" && JC.trim()) doJoin(); });
    jbtn.addEventListener("click", function() { doJoin(); });
  }
  document.querySelectorAll(".code-link").forEach(function(el) {
    el.addEventListener("click", function() {
      var jci2 = $("jci");
      var jbtn2 = $("jbtn");
      if (jci2) { jci2.value = el.getAttribute("data-code"); JC = el.getAttribute("data-code"); }
      if (jbtn2) jbtn2.disabled = false;
      jci2.focus();
    });
  });
  document.querySelectorAll(".test-card").forEach(function(tc) {
    var radios = tc.querySelectorAll('input[type="radio"]');
    var rw = tc.querySelector(".rw");
    if (!rw) return;
    radios.forEach(function(r) {
      r.addEventListener("change", function() { rw.style.display = (r.value === "OUT" && r.checked) ? "block" : "none"; });
    });
  });
  var bf = $("bf");
  if (bf) {
    bf.addEventListener("submit", function(e) {
      e.preventDefault();
      var fd = new FormData(bf);
      var d = dbLoad(); var s = null;
      for (var i = 0; i < d.sessions.length; i++) { if (d.sessions[i].sessionCode === AC) { s = d.sessions[i]; break; } }
      if (s && (s.testType === "blind" || s.testType === "proficiency")) {
        var cs = ["Control","Yellow","Brown","Blue","Green","Red","Purple"];
        var samples = cs.map(function(c, i) { return { colorCode: c, status: fd.get("s" + i + "st"), offNote: fd.get("s" + i + "on") || "" }; });
        doSubmit({ panelistName: fd.get("pn"), testCode: fd.get("tc"), testDate: fd.get("td"), testTime: fd.get("tt"), roundNo: fd.get("rn"), provider: fd.get("pv"), samples: samples });
      } else {
        var bd = { panelistName: fd.get("pn"), productType: fd.get("pt"), otherProductType: fd.get("opt") || "", productVariant: fd.get("pv") || "", productCode: fd.get("pc"), dateOfMfg: fd.get("dm"), controlSampleCode: fd.get("cs"), productTime: fd.get("tm"), testingCompletionDate: fd.get("cd"), testingCompletionTime: fd.get("ct"), remarks: fd.get("rem") || "", appearance: { status: fd.get("app"), reason: fd.get("appr") || "" }, odour: { status: fd.get("odo"), reason: fd.get("odor") || "" }, taste: { status: fd.get("tas") || "IN", reason: fd.get("tasr") || "" } };
        if (bd.productType === "Raw Water") bd.taste = { status: "IN", reason: "" };
        doSubmit(bd);
      }
    });
    var ptsel = $("ptsel");
    if (ptsel) ptsel.addEventListener("change", function() {
      var otf = $("otf"); var vf = $("vf");
      if (otf) otf.style.display = this.value === "Other" ? "block" : "none";
      if (vf) vf.style.display = (this.value === "Finished Goods" || this.value === "CIP Final Rinse Water") ? "block" : "none";
    });
  }
}

// ========== CLICK DELEGATION ==========
document.addEventListener("click", function(e) {
  var node = e.target;
  while (node && node !== document.body) {
    if (node.getAttribute) {
      var act = node.getAttribute("data-act");
      var nav = node.getAttribute("data-nav");
      var vs = node.getAttribute("data-vs");
      var rpt = node.getAttribute("data-rpt");
      var val = node.getAttribute("data-val");
      if (act === "tsel") { TS = true; render(); return; }
      if (act === "ctsel") { TS = false; render(); return; }
      if (act === "start") { doStart(1, node.getAttribute("data-type") || "regular"); return; }
      if (act === "start2") { doStart(parseInt(node.getAttribute("data-count")) || 2); return; }
      if (act === "gen") { doGen(); return; }
      if (act === "copy") { if (navigator.clipboard) navigator.clipboard.writeText(GV).then(function() { toast("Copied!", "info"); }); return; }
      if (act === "cuser") { doCreateUser(); return; }
      if (act === "duser") { if (confirm("Delete " + val + "?")) doDeleteUser(val); return; }
      if (act === "dsess") { if (confirm("Delete " + val + "?")) doDeleteSession(val); return; }
      if (act === "cfilt") { SS = ""; SF = ""; STO = ""; SST = "all"; render(); return; }
      if (act === "cmodal") { $("mover").classList.remove("show"); return; }
      if (act === "reset") { if (confirm("Clear ALL data? This resets everything.")) { dbClear(); location.reload(); } return; }
      if (nav) { navTo(nav); return; }
      if (vs) { doView(vs); return; }
      if (rpt) { openRpt(rpt); return; }
    }
    node = node.parentNode;

});

// ========== SESSION ACTIONS ==========
function doStart(count, type) {
  type = type || "regular";
  var c = genCode(); var d = dbLoad();
  while (d.sessions.some(function(s) { return s.sessionCode === c; })) c = genCode();
  d.sessions.push({ id: uid(), sessionCode: c, status: "in_progress", targetPanelistCount: count, testType: type, ballots: [], createdBy: U.username, createdAt: iso(), completedAt: null });
  dbSave(d);
  AC = c; BN = 1; BI = null; ST = type;
  toast("Session " + c + " created!", "ok");
  V = "ballot"; render();
}

function doGen() {
  var gt = $("gtype") ? $("gtype").value : GT;
  var gc = $("gcnt") ? $("gcnt").value : GC;
  GT = gt; GC = gc;
  var c = genCode(); var d = dbLoad();
  while (d.sessions.some(function(s) { return s.sessionCode === c; })) c = genCode();
  d.sessions.push({ id: uid(), sessionCode: c, status: "in_progress", targetPanelistCount: parseInt(gc), testType: gt, ballots: [], createdBy: U.username, createdAt: iso(), completedAt: null });
  dbSave(d);
  GV = c;
  toast("Session " + c + " created! Share this code.", "ok");
  render();
}

function doJoin() {
  var inp = $("jci");
  var code = (inp ? inp.value : JC).trim().toUpperCase();
  if (!code) { toast("Enter a session code", "error"); return; }
  var d = dbLoad();
  var s = null;
  for (var i = 0; i < d.sessions.length; i++) {
    if (d.sessions[i].sessionCode === code) { s = d.sessions[i]; break; }
  }
  if (!s) {
    var avail = d.sessions.map(function(x) { return x.sessionCode + " (" + x.status + ")"; }).join(", ");
    toast("NOT FOUND: " + code + ". Available: " + (avail || "none"), "error");
    // Update debug panel if visible
    var dbg = $("debug-box");
    if (dbg) dbg.textContent = "JOIN FAILED: " + code + "\nSessions in DB (" + d.sessions.length + "): " + JSON.stringify(d.sessions.map(function(s) { return {code: s.sessionCode, status: s.status, type: s.testType}; }), null, 2) + "\nlocalStorage key: " + SK + "\nRaw localStorage: " + localStorage.getItem(SK);
    return;
  }
  if (s.status === "completed") { toast("Already completed", "error"); return; }
  AC = code; BN = s.ballots.length + 1; ST = s.testType || "regular";
  if (s.ballots.length > 0) {
    var f = s.ballots[0];
    BI = { productType: f.productType, otherProductType: f.otherProductType, productCode: f.productCode, dateOfMfg: f.dateOfMfg, controlSampleCode: f.controlSampleCode, productTime: f.productTime };
  } else { BI = null; }
  JC = ""; V = "ballot"; render();
  toast("Joined " + code + "!", "ok");
}

function doView(code) {
  var d = dbLoad(); var s = null;
  for (var i = 0; i < d.sessions.length; i++) { if (d.sessions[i].sessionCode === code) { s = d.sessions[i]; break; } }
  if (!s) { toast("Not found", "error"); return; }
  VS = s; V = "report"; render();
}

function doSubmit(data) {
  var d = dbLoad(); var s = null;
  for (var i = 0; i < d.sessions.length; i++) { if (d.sessions[i].sessionCode === AC) { s = d.sessions[i]; break; } }
  if (!s) { toast("Failed", "error"); return; }
  s.ballots.push(data);
  if (s.ballots.length >= s.targetPanelistCount) { s.status = "completed"; s.completedAt = iso(); }
  dbSave(d);
  if (s.status === "completed") { VS = s; V = "report"; render(); toast("Session completed!", "ok"); }
  else { BN = s.ballots.length + 1; render(); toast("Submitted! " + (s.targetPanelistCount - s.ballots.length) + " more.", "ok"); }
}

function doCreateUser() {
  var u = $("nu").value.trim(), p = $("np").value, r = $("nr").value;
  if (!u || !p) { toast("Username and password required", "error"); return; }
  var d = dbLoad();
  for (var i = 0; i < d.users.length; i++) { if (d.users[i].username === u) { toast("Already exists", "error"); return; } }
  d.users.push({ id: uid(), username: u, password: hash(p), role: r, createdAt: iso() });
  dbSave(d); toast("Created!", "ok"); render();
}

function doDeleteUser(u) {
  if (u === U.username) { toast("Cannot delete yourself", "error"); return; }
  var d = dbLoad(); d.users = d.users.filter(function(x) { return x.username !== u; }); dbSave(d);

}

function doDeleteSession(c) {
  var d = dbLoad(); d.sessions = d.sessions.filter(function(x) { return x.sessionCode !== c; }); dbSave(d);

  var h = '<div class="test-card"><h4><span style="width:1.5rem;height:1.5rem;background:var(--b);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:700">' + label.charAt(0) + "</span>" + label + '</h4><div style="display:flex;gap:1rem"><label style="display:flex;align-items:center;gap:.5rem;cursor:pointer"><input type="radio" name="' + name + '" value="IN" checked><span style="color:var(--grn);font-weight:500">IN</span></label><label style="display:flex;align-items:center;gap:.5rem;cursor:pointer"><input type="radio" name="' + name + '" value="OUT"><span style="color:var(--red);font-weight:500">OUT</span></label></div><div class="field rw" style="display:none;margin-top:.5rem"><label>Reason</label><select name="' + name + 'r"><option value="">Select...</option>';
  reasons.forEach(function(r) { h += "<option>" + r + "</option>"; });
  h += '</select></div></div>'; return h;
}

function rBlind() {
  var nd = new Date(), cd = nd.toISOString().split("T")[0], ct = nd.toTimeString().slice(0, 5);
  var cs = ["Control", "Yellow", "Brown", "Blue", "Green", "Red", "Purple"];
  var h = '<form id="bf"><div class="card" style="margin-bottom:1rem"><div class="card-body"><div class="grid g2"><div class="field"><label>Name *</label><input name="pn" required></div><div class="field"><label>Test Code</label><input name="tc"></div><div class="field"><label>Date *</label><input name="td" type="date" required value="' + cd + '"></div><div class="field"><label>Time *</label><input name="tt" type="time" required value="' + ct + '"></div><div class="field"><label>Round *</label><input name="rn" required value="1"></div><div class="field"><label>Provider</label><input name="pv"></div></div></div></div>';
  h += '<div class="card" style="margin-bottom:1rem"><div class="card-header"><h3>Samples</h3></div><div class="card-body">';
  cs.forEach(function(c, ci) { h += '<div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:.5rem;margin-bottom:.5rem;align-items:center;padding:.5rem;border:1px solid var(--brd);border-radius:.5rem"><span class="badge" style="background:' + ({"Control":"#e5e7eb","Yellow":"#fef08a","Brown":"#a16207","Blue":"#3b82f6","Green":"#22c55e","Red":"#ef4444","Purple":"#a855f7"})[c] + ";color:" + ((c==="Control"||c==="Yellow"||c==="Green")?"#000":"#fff") + ';font-weight:700;min-width:5rem;justify-content:center">' + c + '</span><select name="s' + ci + 'st"><option value="IN">IN</option><option value="OUT">OUT</option></select><input name="s' + ci + 'on" placeholder="OFF Note"></div>'; });
  h += '</div></div><button type="submit" class="btn btn-primary btn-full" style="height:3rem">Submit</button></form>'; return h;
}
function rProf() { return rBlind().replace("Samples", "Proficiency Samples"); }

function rReport() {
  var s = VS; if (!s) return "<p>No session</p>";
  var ballots = s.ballots || [], total = s.targetPanelistCount;
  var pct = Math.min(100, Math.round((ballots.length / total) * 100));
  var isB = s.testType === "blind" || s.testType === "proficiency";
  var checks = 0, ins = 0; var cat = { Appearance: {i:0,t:0}, Odour: {i:0,t:0}, Taste: {i:0,t:0} };
  ballots.forEach(function(b) { ["appearance", "odour", "taste"].forEach(function(k) { if (b[k] && b[k].status) { var lk = k.charAt(0).toUpperCase() + k.slice(1); cat[lk].t++; checks++; if (b[k].status === "IN") { cat[lk].i++; ins++; } } }); });
  var pp = checks ? Math.round((ins / checks) * 100) : null, ap = pp === 100;
  var h = '<div style="max-width:50rem;margin:0 auto"><div style="display:flex;justify-content:space-between;margin-bottom:1rem"><button class="btn btn-sm btn-secondary" data-nav="dashboard">Back</button><button class="btn btn-sm btn-primary" onclick="window.print()">Print</button></div>';
  var qc = ap ? "var(--grn)" : "var(--red)", qb = ap ? "#f0fdf4" : "#fef2f2";
  h += '<div class="grid g3" style="margin-bottom:1.5rem">' + sc("P", "var(--b)", "#eff6ff", ballots.length + "/" + total, "Panelists") + '<div class="stat-card"><div class="si" style="background:' + qb + ";color:" + qc + '">C</div><div><div class="sv" style="color:' + qc + '">' + (pp !== null ? pp + "%" : "\u2014") + '</div><div class="sl">Quality</div></div></div>' + sc("T", "var(--pur)", "#f5f3ff", s.testType || "regular", "Type") + '</div>';
  var title = s.testType === "blind" ? "Blind Test Report" : s.testType === "proficiency" ? "Proficiency Report" : "Sensory Evaluation Report";
  h += '<div class="report-card"><div class="report-header"><h1>' + title + '</h1><p>Global Acqua Pvt Ltd</p><div style="display:flex;gap:1rem;margin-top:1rem"><div class="badge bb" style="font-family:\'Space Grotesk\',monospace;padding:.5rem 1rem">' + s.sessionCode + '</div><div style="font-size:.8125rem;color:var(--t3)">' + fmtDT(s.completedAt || s.createdAt) + '</div></div></div><div class="report-body">';
  ["Appearance", "Odour", "Taste"].forEach(function(n) { var cv = cat[n]; if (cv.t === 0) return; var cp = Math.round((cv.i / cv.t) * 100), cc = cp === 100 ? "var(--grn)" : "var(--b)"; h += '<div style="margin-bottom:.75rem"><div style="display:flex;justify-content:space-between;font-size:.75rem"><span style="font-weight:600">' + n + '</span><span style="font-weight:700;color:' + cc + '">' + cp + "% IN (" + cv.i + "/" + cv.t + ')</span></div><div style="height:.5rem;background:#f1f5f9;border-radius:999px;overflow:hidden"><div style="height:100%;width:' + cp + "%;background:" + cc + ';border-radius:999px"></div></div></div>'; });
  h += '<h3 style="font-weight:600;margin:1.5rem 0 1rem">Panelist Evaluations</h3>';
  ballots.forEach(function(b, idx) {
    var pC = isB ? "var(--pur)" : "var(--b)";
    h += '<div style="border:1px solid var(--brd);border-radius:.75rem;margin-bottom:1rem;overflow:hidden"><div style="background:' + (isB ? "#f5f3ff" : "#eff6ff") + ';padding:.75rem 1rem;border-bottom:1px solid ' + (isB ? "#ede9fe" : "#dbeafe") + ';display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:.5rem"><span style="width:1.75rem;height:1.75rem;background:' + pC + ';color:#fff;border-radius:.375rem;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700">' + (idx + 1) + '</span><span style="font-weight:600">' + esc(b.panelistName || "P" + (idx + 1)) + '</span></div></div><div style="padding:1rem">';
    if (isB && b.samples) {
      h += '<table style="width:100%"><thead><tr><th>Sl</th><th>Color</th><th>Result</th><th>OFF Note</th></tr></thead><tbody>';
      b.samples.forEach(function(sm, si) { h += "<tr><td>" + (sm.colorCode === "Control" ? "C" : si) + "</td><td>" + sm.colorCode + "</td><td><span class='badge " + (sm.status === "IN" ? "bg" : "br") + "'>" + (sm.colorCode === "Control" ? "IN" : sm.status) + "</span></td><td>" + (sm.offNote || "-") + "</td></tr>"; });
      h += "</tbody></table>";
    } else {
      ["appearance", "odour"].concat(b.productType !== "Raw Water" ? ["taste"] : []).forEach(function(k) {
        if (!b[k]) return;
        h += '<div class="result-row ' + (b[k].status === "IN" ? "pass" : "fail") + '"><span style="font-weight:500">' + k.charAt(0).toUpperCase() + k.slice(1) + '</span><div style="display:flex;align-items:center;gap:.5rem"><span class="badge ' + (b[k].status === "IN" ? "bg" : "br") + '">' + b[k].status + "</span>" + (b[k].status === "OUT" ? '<span style="font-size:.75rem;color:var(--red)">' + esc(b[k].reason) + "</span>" : "") + "</div></div>";
      });
      if (b.remarks) h += '<div style="margin-top:.5rem;background:#fafbfc;padding:.5rem;border-radius:.5rem;font-size:.8125rem"><b>Remarks:</b> ' + esc(b.remarks) + "</div>";
    }
    h += "</div></div>";
  });
  h += '<div style="text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid #f1f5f9;font-size:.75rem;color:var(--t4)">Global Acqua Pvt Ltd</div></div></div></div>'; return h;
}

function openRpt(type) {
  var ss = dbLoad().sessions || []; var f;
  if (type === "daily") f = ss.filter(function(s) { return (!s.testType || s.testType === "regular") && s.status === "completed"; });
  else if (type === "blind") f = ss.filter(function(s) { return s.testType === "blind" && s.status === "completed"; });
  else f = ss.filter(function(s) { return s.testType === "proficiency" && s.status === "completed"; });
  var title = type === "daily" ? "Daily" : type === "blind" ? "Blind Test" : "Proficiency";
  var h = '<div style="max-height:70vh;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h3 style="font-weight:700">' + title + '</h3><button class="btn btn-sm btn-secondary" data-act="cmodal">Close</button></div><div class="table-wrap"><table style="width:100%;font-size:.8125rem"><thead><tr><th>Code</th><th>Product</th><th>Panelists</th><th>Result</th><th>Date</th></tr></thead><tbody>';
  if (f.length) { f.forEach(function(s) { var fb = s.ballots[0] || {}; var allIn = s.ballots.every(function(x) { return (x.appearance && x.appearance.status === "IN") && (x.odour && x.odour.status === "IN"); }); h += '<tr><td style="font-weight:700;color:var(--b)">' + s.sessionCode + "</td><td>" + esc(fb.productType || "-") + "</td><td>" + s.ballots.length + "/" + s.targetPanelistCount + '</td><td><span class="badge ' + (allIn ? "bg" : "br") + '">' + (allIn ? "IN" : "OUT") + "</span></td><td>" + fmtD(s.completedAt) + "</td></tr>"; }); }
  else { h += '<tr><td colspan="5" style="text-align:center;color:var(--t4);padding:2rem">No completed sessions</td></tr>'; }
  h += "</tbody></table></div></div>"; $("mcont").innerHTML = h; $("mover").classList.add("show");
}

// ========== STATIC LISTENERS ==========
$("login-btn").addEventListener("click", function() { doLogin(); });
$("logout-btn").addEventListener("click", function() { doLogout(); });
$("login-pass").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
$("login-user").addEventListener("keydown", function(e) { if (e.key === "Enter") $("login-pass").focus(); });
$("mover").addEventListener("click", function(e) { if (e.target === $("mover")) $("mover").classList.remove("show"); });

// ========== INIT ==========
dbInit();
console.log("[Global Acqua] Ready. DB: " + SK + ", Users: " + dbLoad().users.length + ", Sessions: " + dbLoad().sessions.length);
</script>
</body>
