<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Global Acqua - Sensory Analysis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--d:#0a1628;--n:#0d2137;--b:#0064C8;--s:#009DE0;--g:#f0f4f8;--w:#fff;--t1:#1a202c;--t2:#4a5568;--t3:#718096;--t4:#a0aec0;--brd:#e2e8f0;--red:#dc2626;--grn:#059669;--amb:#d97706;--pur:#7c3aed}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--g);color:var(--t1);line-height:1.6}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer;border:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 3px rgba(0,100,200,.1)}
.page{display:none;min-height:100vh}.page.active{display:flex}
.login-page{background:linear-gradient(160deg,var(--d),#0d2137 35%,#0f3460 70%,#16213e);align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--w);border-radius:1.25rem;padding:2.5rem;width:100%;max-width:26rem;box-shadow:0 25px 60px -12px rgba(0,0,0,.4)}
.login-logo{width:3rem;height:3rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;font-size:1.5rem;color:#fff}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.625rem;font-weight:700;margin-bottom:.25rem}
.login-card p{color:var(--t3);font-size:.875rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}.field label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.375rem}
.field input,.field select,.field textarea{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.875rem;transition:all .15s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:.625rem;font-weight:600;font-size:.875rem;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--b),var(--s));color:#fff;box-shadow:0 4px 14px -3px rgba(0,100,200,.4)}.btn-primary:hover{transform:translateY(-1px)}.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--w);color:var(--t2);border:1px solid var(--brd)}.btn-secondary:hover{background:#f7fafc}
.btn-sm{padding:.375rem .75rem;font-size:.75rem;border-radius:.5rem}.btn-full{width:100%}.btn-danger{background:#fee2e2;color:var(--red);border:1px solid #fecaca}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:.5rem;padding:.75rem;color:var(--red);font-size:.8125rem;margin-bottom:1rem}
.sidebar{width:16rem;background:linear-gradient(180deg,var(--d),var(--n) 50%,#0f3460);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s}
.sidebar .logo{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .logo .icon{width:2.5rem;height:2.5rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.sidebar .logo h2{font-family:'Space Grotesk',sans-serif;font-size:1.125rem;font-weight:700}
.sidebar .logo span{font-size:.625rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em}
.sidebar nav{flex:1;padding:1rem;display:flex;flex-direction:column;gap:.25rem;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:rgba(255,255,255,.5);transition:all .2s;text-decoration:none;cursor:pointer}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:#fff}
.sidebar .user-box{padding:1rem;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .user-box .avatar{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.sidebar .user-box .info{flex:1}.sidebar .user-box .name{font-size:.8125rem;font-weight:500}.sidebar .user-box .role{font-size:.625rem;color:rgba(255,255,255,.5)}
.main{flex:1;margin-left:16rem;padding:2rem}
.main-header{margin-bottom:2rem}.main-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}.main-header p{font-size:.8125rem;color:var(--t3);margin-top:.25rem}
.card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:.75rem;background:#fafbfc}
.card-header h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.875rem}
.card-body{padding:1.5rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--w);border:1px solid var(--brd);border-radius:.75rem;padding:1.25rem;display:flex;align-items:center;gap:.75rem}
.stat-card .si{width:2.5rem;height:2.5rem;border-radius:.625rem;display:flex;align-items:center;justify-content:center;font-size:1.125rem}
.stat-card .sv{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;line-height:1}
.stat-card .sl{font-size:.6875rem;color:var(--t3);margin-top:.25rem}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8125rem}
th{background:var(--d);color:#fff;padding:.75rem;text-align:left;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:.625rem .75rem;border-bottom:1px solid #f1f5f9}tr:hover{background:#f8fafc}
.badge{display:inline-flex;padding:.25rem .625rem;border-radius:999px;font-size:.6875rem;font-weight:600;white-space:nowrap}
.bg{background:#d1fae5;color:#065f46}.br{background:#fee2e2;color:#991b1b}.bb{background:#dbeafe;color:#1e40af}.ba{background:#fef3c7;color:#92400e}.bp{background:#ede9fe;color:#5b21b6}
.filter-bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding:1rem 1.5rem}
.filter-bar label{font-size:.75rem;font-weight:500;color:var(--t3)}
.filter-bar input,.filter-bar select{height:2rem;padding:0 .625rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.75rem}
.session-code{font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:700;letter-spacing:.15em;color:var(--b);text-align:center;background:#f8fafc;border:2px dashed var(--brd);border-radius:.75rem;padding:1rem}
.test-card{border:1px solid var(--brd);border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.test-card h4{font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.radio-group{display:flex;gap:1rem}
.report-card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.report-header{padding:2rem;border-bottom:1px solid #f1f5f9}
.report-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
.report-header p{color:var(--t3);font-size:.8125rem}
.report-body{padding:2rem}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem;border-radius:.5rem;border:1px solid var(--brd);margin-bottom:.5rem}
.result-row.pass{background:#f0fdf4;border-color:#bbf7d0}.result-row.fail{background:#fef2f2;border-color:#fecaca}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:1rem;padding:1.5rem;width:100%;max-width:40rem;margin:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.toast{position:fixed;top:1rem;right:1rem;z-index:200;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:#fff;box-shadow:0 8px 30px -5px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}.toast.ok{background:#059669}.toast.err2{background:#dc2626}.toast.inf{background:#0064C8}
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:var(--w);border-bottom:1px solid var(--brd);padding:.75rem 1rem;align-items:center;justify-content:space-between}
.hamburger{background:none;font-size:1.25rem;padding:.25rem}
@media print{.no-print{display:none!important}body{background:#fff!important}.main{margin-left:0!important;padding:0!important}}
@media(max-width:768px){.g2,.g3,.g4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);width:16rem}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:1rem}.mobile-header{display:flex!important}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="page-login" class="page login-page active">
  <div style="text-align:center;margin-bottom:2rem;color:#fff">
    <div style="font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;margin-bottom:.5rem">Global Acqua</div>
    <div style="font-size:.75rem;opacity:.6;letter-spacing:.1em;text-transform:uppercase">Sensory Quality Control</div>
  </div>
  <div class="login-card">
    <div class="login-logo">💧</div>
    <h1>Welcome back</h1>
    <p>Sign in to access your dashboard</p>
    <div id="login-error" class="err" style="display:none"></div>
    <div class="field"><label>Username</label><input type="text" id="login-user" placeholder="Enter username"></div>
    <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="Enter password"></div>
    <button class="btn btn-primary btn-full" id="login-btn" style="height:2.75rem">Sign In</button>
    <div style="margin-top:1rem;padding:.75rem;background:#f0f4f8;border-radius:.5rem;font-size:.6875rem;color:var(--t3)">
      <b>Demo Accounts:</b><br>Admin: admin / admin123<br>User: SD / sd123</div>
  </div>
</div>

<div id="page-app" class="page">
  <div class="mobile-header"><div style="display:flex;align-items:center;gap:.5rem"><div style="width:2rem;height:2rem;border-radius:.5rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;color:#fff">💧</div><span style="font-weight:700;font-size:.8125rem">Global Acqua</span></div><button class="hamburger" id="hamburger-btn">☰</button></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo"><div class="icon">💧</div><div><h2>Global Acqua</h2><span id="sr-label">Panel</span></div></div>
    <nav id="snav"></nav>
    <div class="user-box">
      <div class="avatar" id="savatar">A</div>
      <div class="info"><div class="name" id="sname">Admin</div><div class="role" id="srole">Administrator</div></div>
      <button class="btn btn-sm" id="logout-btn" style="color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)">Out</button>
    </div>
  </aside>
  <div class="main" id="mc"></div>
</div>

<div class="modal-overlay" id="mover"><div class="modal" id="mcont"></div></div>

<script>
var U=null,V='dashboard',AC='',BN=1,BI=null,ST='regular',VS=null,JC='',TS=false;
var SS='',SF='',STO='',SST='all',GT='regular',GC='3',GV='';

function $(id){return document.getElementById(id)}
function _log(m){console.log('[GAQ] '+m)}

function dbLoad(){try{return JSON.parse(localStorage.getItem('gaq'))||{users:[],sessions:[]}}catch(e){return{users:[],sessions:[]}}}
function dbSave(d){localStorage.setItem('gaq',JSON.stringify(d))}
function _h(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h|0}return'h'+h}
function _id(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return'r'+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function _now(){return new Date().toISOString()}
function _e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function _f(s){return s?new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'N/A'}
function _fd(s){return s?new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'N/A'}

function _toast(m,t){var el=$('toast');el.textContent=m;el.className='toast '+(t==='error'?'err2':t==='info'?'inf':'ok')+' show';clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},3500)}

function _gc_fn(){var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',c='GAQ-';for(var i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];return c}
function _cbg(c){return({Control:'#e5e7eb',Yellow:'#fef08a',Brown:'#a16207',Blue:'#3b82f6',Green:'#22c55e',Red:'#ef4444',Purple:'#a855f7'})[c]||'#ccc'}
function _ct(c){return(c==='Control'||c==='Yellow'||c==='Green')?'#000':'#fff'}
function _sc(i,c,b,v,l){return'<div class="stat-card"><div class="si" style="background:'+b+';color:'+c+'">'+i+'</div><div><div class="sv">'+v+'</div><div class="sl">'+l+'</div></div></div>'}

function dbInit(){
  var d=dbLoad();
  if(!d.users||!d.users.length){
    d.users=[
      {id:_id(),username:'admin',password:_h('admin123'),role:'admin',createdAt:_now()},
      {id:_id(),username:'Saila Ruidas',password:_h('saila123'),role:'admin',createdAt:_now()},
      {id:_id(),username:'SD',password:_h('sd123'),role:'user',createdAt:_now()},
      {id:_id(),username:'RM',password:_h('rm123'),role:'user',createdAt:_now()},
      {id:_id(),username:'SC',password:_h('sc123'),role:'user',createdAt:_now()},
      {id:_id(),username:'SM',password:_h('sm123'),role:'user',createdAt:_now()}
    ];d.sessions=[];dbSave(d);_log('Created '+d.users.length+' users');
  }
  _log('DB ready. Users:'+d.users.length);
}

function findUser(u,p){var d=dbLoad();for(var i=0;i<d.users.length;i++){if(d.users[i].username===u&&d.users[i].password===_h(p))return d.users[i]}return null}

function doLogin(){
  var u=$('login-user').value.trim(),p=$('login-pass').value;
  _log('Login: "'+u+'"');
  if(!u||!p){$('login-error').textContent='Please enter username and password';$('login-error').style.display='block';return}
  var found=findUser(u,p);
  if(!found){$('login-error').textContent='Incorrect username or password';$('login-error').style.display='block';_log('FAIL');return}
  U={username:found.username,role:found.role};$('login-error').style.display='none';
  _log('OK: '+U.username);showApp();
}

function doLogout(){U=null;V='dashboard';$('page-app').classList.remove('active');$('page-login').classList.add('active');$('login-user').value='';$('login-pass').value=''}

function showApp(){
  $('page-login').classList.remove('active');$('page-app').classList.add('active');
  $('sname').textContent=U.username;$('savatar').textContent=U.username.charAt(0).toUpperCase();
  $('sr-label').textContent=U.role==='admin'?'Admin Panel':'Sensory Panel';
  $('srole').textContent=U.role==='admin'?'Administrator':'Panelist';
  buildNav();navTo('dashboard');_toast('Welcome, '+U.username+'!','ok');
}

function buildNav(){
  var n=$('snav');
  if(U.role==='admin'){
    n.innerHTML='<a data-nav="dashboard">📊 Dashboard</a><a data-nav="users">👥 Users</a><a data-nav="sessions">📋 Sessions</a><a data-nav="generate">🔑 Generate</a><div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)"><div style="font-size:.625rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;padding:0 1rem;margin-bottom:.5rem">Reports</div><a data-rpt="daily">📅 Daily</a><a data-rpt="blind">🎯 Blind</a><a data-rpt="proficiency">⭐ Proficiency</a></div>';
  } else {
    n.innerHTML='<a data-nav="dashboard">📊 Dashboard</a><a data-nav="active">📋 Active</a>';
  }
  n.querySelectorAll('a[data-nav]').forEach(function(a){a.onclick=function(){navTo(a.getAttribute('data-nav'))}});
  n.querySelectorAll('a[data-rpt]').forEach(function(a){a.onclick=function(){openRpt(a.getAttribute('data-rpt'))}});
}

function navTo(v){V=v;document.querySelectorAll('.sidebar nav a').forEach(function(a){a.classList.remove('active')});render();$('sidebar').classList.remove('open')}

function render(){
  var m=$('mc');
  switch(V){
    case'dashboard':m.innerHTML=U.role==='admin'?rAdmin():rUser();break;
    case'users':m.innerHTML=rUsers();break;
    case'sessions':m.innerHTML=rSessions();break;
    case'generate':m.innerHTML=rGen();break;
    case'active':m.innerHTML=rActive();break;
    case'ballot':m.innerHTML=rBallot();attachRadio();break;
    case'report':m.innerHTML=rReport();break;
    default:m.innerHTML=U.role==='admin'?rAdmin():rUser();
  }
}

function rAdmin(){
  var ss=dbLoad().sessions||[];
  var done=ss.filter(function(s){return s.status==='completed'});
  var today=new Date().toDateString();
  var tn=done.filter(function(s){return s.createdAt&&new Date(s.createdAt).toDateString()===today}).length;
  var bl=ss.reduce(function(a,s){return a+s.ballots.length},0);
  return'<div class="main-header"><h1>Admin Dashboard</h1><p>Welcome, '+_e(U.username)+'</p></div><div class="grid g4" style="margin-bottom:2rem">'+_sc('📊','var(--b)','#eff6ff',ss.length,'Sessions')+_sc('✅','var(--grn)','#f0fdf4',done.length,'Completed')+_sc('📋','var(--amb)','#fffbeb',tn,'Today')+_sc('👥','var(--pur)','#f5f3ff',bl,'Ballots')+'</div><div class="grid g2"><div class="card"><div class="card-header"><span style="font-size:1.25rem">🔑</span><h3>Quick Actions</h3></div><div class="card-body"><button class="btn btn-primary btn-full" data-nav="generate" style="margin-bottom:.75rem">Generate Code</button><button class="btn btn-secondary btn-full" data-nav="sessions">All Sessions</button></div></div><div class="card"><div class="card-header"><span style="font-size:1.25rem">👥</span><h3>Users</h3></div><div class="card-body"><button class="btn btn-primary btn-full" data-nav="users">Manage Users</button></div></div></div>';
}

function rUser(){
  var ss=U.role==='admin'?(dbLoad().sessions||[]):(dbLoad().sessions||[]).filter(function(s){return s.createdBy===U.username});
  var done=ss.filter(function(s){return s.status==='completed'});
  var today=new Date().toDateString();
  var tn=done.filter(function(s){return s.completedAt&&new Date(s.completedAt).toDateString()===today}).length;
  var bl=ss.reduce(function(a,s){return a+s.ballots.length},0);
  var h='<div class="main-header"><h1>Sensory Analysis Dashboard</h1><p>Create or join a session</p></div><div class="grid g4" style="margin-bottom:2rem">'+_sc('📊','var(--b)','#eff6ff',ss.length,'Sessions')+_sc('✅','var(--grn)','#f0fdf4',done.length,'Completed')+_sc('📋','var(--amb)','#fffbeb',tn,'Today')+_sc('👥','var(--pur)','#f5f3ff',bl,'Ballots')+'</div><div class="grid g2">';
  h+='<div class="card"><div class="card-header"><span style="font-size:1.25rem">➕</span><h3>New Session</h3></div><div class="card-body"><p style="font-size:.8125rem;color:var(--t3);margin-bottom:1rem">Create a sensory evaluation session</p>';
  if(!TS){
    h+='<button class="btn btn-primary btn-full" data-act="tsel">1 Panelist Session</button>';
  } else {
    h+='<div style="display:flex;flex-direction:column;gap:.5rem"><button class="btn btn-full" data-act="start" data-type="regular" style="background:#eff6ff;border:1px solid #bfdbfe;color:var(--b);font-weight:600">📋 Regular Test</button><button class="btn btn-full" data-act="start" data-type="blind" style="background:#f5f3ff;border:1px solid #ddd6fe;color:var(--pur);font-weight:600">🎯 Blind Test</button><button class="btn btn-full" data-act="start" data-type="proficiency" style="background:#f0fdf4;border:1px solid #bbf7d0;color:var(--grn);font-weight:600">⭐ Proficiency</button><button class="btn btn-secondary btn-full" data-act="ctsel">Cancel</button></div>';
  }
  h+='<div style="margin-top:.75rem;display:flex;flex-direction:column;gap:.5rem"><button class="btn btn-full" data-act="start2" data-count="2" style="background:linear-gradient(135deg,#003A70,#0064C8);color:#fff">👥 2 Panelists</button><button class="btn btn-full" data-act="start2" data-count="3" style="background:linear-gradient(135deg,#00274d,#003A70);color:#fff">👥 3 Panelists</button></div></div></div>';
  h+='<div class="card"><div class="card-header"><span style="font-size:1.25rem">🔑</span><h3>Join Session</h3></div><div class="card-body"><p style="font-size:.8125rem;color:var(--t3);margin-bottom:1rem">Enter a session code to join</p><div class="field"><input id="jci" placeholder="e.g. GAQ-ABC123"></div><button id="jbtn" class="btn btn-primary btn-full" disabled>Join Session</button><p style="font-size:.6875rem;color:var(--t4);text-align:center;margin-top:.5rem">Ask the session admin for the code</p></div></div></div>';

function startSession(count,type){
  type=type||'regular';var c=_gc_fn();var d=dbLoad();
  while(d.sessions.some(function(s){return s.sessionCode===c}))c=_gc_fn();
  d.sessions.push({id:_id(),sessionCode:c,status:'in_progress',targetPanelistCount:count,testType:type,ballots:[],createdBy:U.username,createdAt:_now(),completedAt:null});dbSave(d);
  AC=c;BN=1;BI=null;ST=type;_toast('Session '+c+' created!','ok');V='ballot';render();
}

function joinSession(){
  var inp=$('jci');var raw=inp?inp.value:JC;var code=raw.trim().toUpperCase();
  if(!code){_toast('Enter a session code','error');return}
  var d=dbLoad();var s=null;
  for(var i=0;i<d.sessions.length;i++){if(d.sessions[i].sessionCode===code){s=d.sessions[i];break}}
  if(!s){_toast('Session not found','error');return}
  if(s.status==='completed'){_toast('Already completed','error');return}
  AC=code;BN=s.ballots.length+1;ST=s.testType||'regular';
  if(s.ballots.length>0){var f=s.ballots[0];BI={productType:f.productType,otherProductType:f.otherProductType,productCode:f.productCode,dateOfMfg:f.dateOfMfg,controlSampleCode:f.controlSampleCode,productTime:f.productTime}}else{BI=null}
  JC='';V='ballot';render();_toast('Joined '+code+'!','ok');
}

function viewSession(code){var d=dbLoad();var s=null;for(var i=0;i<d.sessions.length;i++){if(d.sessions[i].sessionCode===code){s=d.sessions[i];break}}if(!s){_toast('Not found','error');return}VS=s;V='report';render()}

function submitBallotToSess(data){
  var d=dbLoad();var s=null;for(var i=0;i<d.sessions.length;i++){if(d.sessions[i].sessionCode===AC){s=d.sessions[i];break}}
  if(!s){_toast('Failed','error');return}
  s.ballots.push(data);if(s.ballots.length>=s.targetPanelistCount){s.status='completed';s.completedAt=_now()}dbSave(d);
  if(s.status==='completed'){VS=s;V='report';render();_toast('Completed!','ok')}
  else{BN=s.ballots.length+1;if(s.ballots.length===1&&ST==='regular'){BI={productType:data.productType,otherProductType:data.otherProductType,productCode:data.productCode,dateOfMfg:data.dateOfMfg,controlSampleCode:data.controlSampleCode,productTime:data.productTime}}render();_toast('Submitted! '+(s.targetPanelistCount-s.ballots.length)+' more.','ok')}
}

function attachRadio(){
  var cards=document.querySelectorAll('.test-card');
  for(var i=0;i<cards.length;i++){(function(tc){var radios=tc.querySelectorAll('input[type=radio]');var rw=tc.querySelector('.rw');if(!rw)return;for(var j=0;j<radios.length;j++){radios[j].onchange=function(){rw.style.display=(radios[j].value==='OUT'&&radios[j].checked)?'block':'none'}}})(cards[i])}
}

function openRpt(type){
  var ss=dbLoad().sessions||[];var f;
  if(type==='daily')f=ss.filter(function(s){return(!s.testType||s.testType==='regular')&&s.status==='completed'});
  else if(type==='blind')f=ss.filter(function(s){return s.testType==='blind'&&s.status==='completed'});
  else f=ss.filter(function(s){return s.testType==='proficiency'&&s.status==='completed'});
  var title=type==='daily'?'Daily':type==='blind'?'Blind Test':'Proficiency';
  var h='<div style="max-height:70vh;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h3 style="font-weight:700">'+title+'</h3><button class="btn btn-sm btn-secondary" data-act="cmodal">Close</button></div><div class="table-wrap"><table style="width:100%;font-size:.8125rem"><thead><tr><th>Code</th><th>Product</th><th>Panelists</th><th>Result</th><th>Date</th></tr></thead><tbody>';
  if(f.length){f.forEach(function(s){var fb=s.ballots[0]||{};var allIn=s.ballots.every(function(x){return(x.appearance&&x.appearance.status==='IN')&&(x.odour&&x.odour.status==='IN')});h+='<tr><td style="font-weight:700;color:var(--b)">'+s.sessionCode+'</td><td>'+_e(fb.productType||'-')+'</td><td>'+s.ballots.length+'/'+s.targetPanelistCount+'</td><td><span class="badge '+(allIn?'bg':'br')+'">'+(allIn?'IN':'OUT')+'</span></td><td>'+_f(s.completedAt)+'</td></tr>'})}
  else{h+='<tr><td colspan="5" style="text-align:center;color:var(--t4);padding:2rem">No completed sessions</td></tr>'}
  h+='</tbody></table></div></div>';$('mcont').innerHTML=h;$('mover').classList.add('show');
}

// ===== ALL CLICKS VIA DELEGATION ON #mc =====
$('mc').addEventListener('click',function(e){
  var t=e.target;
  // Walk up to find data-act, data-nav, data-vs, data-rpt
  var node=t;
  while(node&&node!==document.body){
    if(node.getAttribute){
      var act=node.getAttribute('data-act');
      var nav=node.getAttribute('data-nav');
      var vs=node.getAttribute('data-vs');
      var rpt=node.getAttribute('data-rpt');
      var val=node.getAttribute('data-val');
      var cnt=node.getAttribute('data-count');
      var typ=node.getAttribute('data-type');

      if(act==='tsel'){TS=true;render();return}
      if(act==='ctsel'){TS=false;render();return}
      if(act==='start'){startSession(1,typ);return}
      if(act==='start2'){startSession(parseInt(cnt)||2);return}
      if(act==='gen'){
        var c=_gc_fn();var d=dbLoad();
        while(d.sessions.some(function(s){return s.sessionCode===c}))c=_gc_fn();
        var gt=$('gtype')?$('gtype').value:GT;var gc=$('gcnt')?$('gcnt').value:GC;GT=gt;GC=gc;
        d.sessions.push({id:_id(),sessionCode:c,status:'in_progress',targetPanelistCount:parseInt(gc),testType:gt,ballots:[],createdBy:U.username,createdAt:_now(),completedAt:null});dbSave(d);GV=c;_toast('Session '+c+' created!','ok');render();return;
      }
      if(act==='copy'){if(navigator.clipboard)navigator.clipboard.writeText(GV).then(function(){_toast('Copied!','info')});else _toast('Code: '+GV,'info');return}
      if(act==='cuser'){
        var u=$('nu').value.trim(),p=$('np').value,r=$('nr').value;
        if(!u||!p){_toast('Username and password required','error');return}
        var dd=dbLoad();for(var ii=0;ii<dd.users.length;ii++){if(dd.users[ii].username===u){_toast('Already exists','error');return}}
        dd.users.push({id:_id(),username:u,password:_h(p),role:r,createdAt:_now()});dbSave(dd);_toast('Created!','ok');render();return;
      }
      if(act==='duser'){
        if(val===U.username){_toast("Cannot delete yourself",'error');return}
        if(!confirm('Delete '+val+'?'))return;
        var du=dbLoad();du.users=du.users.filter(function(x){return x.username!==val});dbSave(du);_toast('Deleted','ok');render();return;
      }
      if(act==='dsess'){
        if(!confirm('Delete '+val+'?'))return;
        var ds=dbLoad();ds.sessions=ds.sessions.filter(function(x){return x.sessionCode!==val});dbSave(ds);_toast('Deleted','ok');render();return;
      }
      if(act==='cfilt'){SS='';SF='';STO='';SST='all';render();return}
      if(act==='cmodal'){$('mover').classList.remove('show');return}
      if(nav){navTo(nav);return}
      if(vs){viewSession(vs);return}
      if(rpt){openRpt(rpt);return}
    }
    node=node.parentNode;
  }
});

// ===== JOIN BUTTON & INPUT (wired after each render) =====
var _origRender=render;
render=function(){
  _origRender();
  // Wire join input/button after render
  var jci=$('jci');
  var jbtn=$('jbtn');
  if(jci&&jbtn){
    jci.oninput=function(){JC=this.value.toUpperCase();jbtn.disabled=!JC.trim()};
    jci.onkeydown=function(e){if(e.key==='Enter'&&JC.trim())joinSession()};
    jbtn.onclick=function(){joinSession()};
    _log('Join wired');
  }
  // Wire filter inputs
  var ssrch=$('ssrch');if(ssrch)ssrch.oninput=function(){SS=this.value;render()};
  var sfrom=$('sfrom');if(sfrom)sfrom.onchange=function(){SF=this.value;render()};
  var sto=$('sto');if(sto)sto.onchange=function(){STO=this.value;render()};
  var sst=$('sst');if(sst)sst.onchange=function(){SST=this.value;render()};
  // Wire form submit
  var bf=$('bf');
  if(bf){
    bf.onsubmit=function(e){
      e.preventDefault();
      var fd=new FormData(bf);
      var d=dbLoad();var s=null;
      for(var i=0;i<d.sessions.length;i++){if(d.sessions[i].sessionCode===AC){s=d.sessions[i];break}}
      if(s&&(s.testType==='blind'||s.testType==='proficiency')){
        var cs=['Control','Yellow','Brown','Blue','Green','Red','Purple'];
        var samples=cs.map(function(c,i){return{colorCode:c,status:fd.get('s'+i+'st'),offNote:fd.get('s'+i+'on')||''}});
        submitBallotToSess({panelistName:fd.get('pn'),testCode:fd.get('tc'),testDate:fd.get('td'),testTime:fd.get('tt'),roundNo:fd.get('rn'),provider:fd.get('pv'),samples:samples});
      } else {
        var bd={panelistName:fd.get('pn'),productType:fd.get('pt'),otherProductType:fd.get('opt')||'',productVariant:fd.get('pv')||'',productCode:fd.get('pc'),dateOfMfg:fd.get('dm'),controlSampleCode:fd.get('cs'),productTime:fd.get('tm'),testingCompletionDate:fd.get('cd'),testingCompletionTime:fd.get('ct'),remarks:fd.get('rem')||'',appearance:{status:fd.get('app'),reason:fd.get('appr')||''},odour:{status:fd.get('odo'),reason:fd.get('odor')||''},taste:{status:fd.get('tas')||'IN',reason:fd.get('tasr')||''}};
        if(bd.productType==='Raw Water')bd.taste={status:'IN',reason:''};
        submitBallotToSess(bd);
      }
    };
    // Wire product type select
    var ptsel=$('ptsel');
    if(ptsel)ptsel.onchange=function(){
      var otf=$('otf');var vf=$('vf');
      if(otf)otf.style.display=this.value==='Other'?'block':'none';
      if(vf)vf.style.display=(this.value==='Finished Goods'||this.value==='CIP Final Rinse Water')?'block':'none';
    };
    attachRadio();
  }
};

// ===== STATIC BUTTONS =====
$('login-btn').onclick=function(){doLogin()};
$('logout-btn').onclick=function(){doLogout()};
$('hamburger-btn').onclick=function(){$('sidebar').classList.toggle('open')};
$('mover').onclick=function(e){if(e.target===$('mover'))$('mover').classList.remove('show')};
$('login-pass').onkeydown=function(e){if(e.key==='Enter')doLogin()};
$('login-user').onkeydown=function(e){if(e.key==='Enter')$('login-pass').focus()};

_log('App ready');
dbInit();
</script>
