<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Acqua - Sensory Analysis</title>
<meta name="description" content="Sensory Quality Control System - Water quality sensory evaluation">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--d:#0a1628;--n:#0d2137;--b:#0064C8;--s:#009DE0;--l:#35C4F0;--g:#f0f4f8;--w:#fff;--t1:#1a202c;--t2:#4a5568;--t3:#718096;--t4:#a0aec0;--brd:#e2e8f0;--red:#dc2626;--grn:#059669;--amb:#d97706;--pur:#7c3aed}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--g);color:var(--t1);line-height:1.6;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer;border:none;outline:none}
input:focus,select:focus,textarea:focus{outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:var(--b);border-radius:999px}
.page{display:none;min-height:100vh}.page.active{display:flex}
.login-page{background:linear-gradient(160deg,var(--d) 0%,#0d2137 35%,#0f3460 70%,#16213e 100%);align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--w);border-radius:1.25rem;padding:2.5rem;width:100%;max-width:26rem;box-shadow:0 25px 60px -12px rgba(0,0,0,.4)}
.login-logo{width:3rem;height:3rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;font-size:1.5rem;color:#fff}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.625rem;font-weight:700;color:var(--t1);margin-bottom:.25rem}
.login-card p{color:var(--t3);font-size:.875rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}.field label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.375rem}
.field input,.field select,.field textarea{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.875rem;transition:all .15s}
.field textarea{height:auto;padding:.75rem;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(0,100,200,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:.625rem;font-weight:600;font-size:.875rem;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--b),var(--s));color:#fff;box-shadow:0 4px 14px -3px rgba(0,100,200,.4)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px -3px rgba(0,100,200,.5)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--w);color:var(--t2);border:1px solid var(--brd)}.btn-secondary:hover{background:#f7fafc}
.btn-sm{padding:.375rem .75rem;font-size:.75rem;border-radius:.5rem}
.btn-full{width:100%}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:.5rem;padding:.75rem;color:var(--red);font-size:.8125rem;margin-bottom:1rem}
.sidebar{width:16rem;background:linear-gradient(180deg,var(--d),var(--n) 50%,#0f3460);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s}
.sidebar .logo{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .logo .icon{width:2.5rem;height:2.5rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.sidebar .logo h2{font-family:'Space Grotesk',sans-serif;font-size:1.125rem;font-weight:700}
.sidebar .logo span{font-size:.625rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em}
.sidebar nav{flex:1;padding:1rem;display:flex;flex-direction:column;gap:.25rem;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:rgba(255,255,255,.5);transition:all .2s;text-decoration:none;cursor:pointer}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:#fff}
.sidebar .user-box{padding:1rem;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .user-box .avatar{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.sidebar .user-box .info{flex:1;min-width:0}
.sidebar .user-box .name{font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .user-box .role{font-size:.625rem;color:rgba(255,255,255,.5)}
.main{flex:1;margin-left:16rem;padding:2rem}
.main-header{margin-bottom:2rem}.main-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;color:var(--t1)}.main-header p{font-size:.8125rem;color:var(--t3);margin-top:.25rem}
.card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:.75rem;background:#fafbfc}
.card-header h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.875rem}
.card-body{padding:1.5rem}
.grid{display:grid;gap:1rem}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:1rem}.mobile-header{display:flex!important}}
.stat-card{background:var(--w);border:1px solid var(--brd);border-radius:.75rem;padding:1.25rem;display:flex;align-items:center;gap:.75rem}
.stat-card .stat-icon{width:2.5rem;height:2.5rem;border-radius:.625rem;display:flex;align-items:center;justify-content:center;font-size:1.125rem}
.stat-card .stat-val{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;line-height:1}
.stat-card .stat-lbl{font-size:.6875rem;color:var(--t3);margin-top:.25rem}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8125rem}
th{background:var(--d);color:#fff;padding:.75rem;text-align:left;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:.625rem .75rem;border-bottom:1px solid #f1f5f9}tr:hover{background:#f8fafc}
.badge{display:inline-flex;align-items:center;padding:.25rem .625rem;border-radius:999px;font-size:.6875rem;font-weight:600;white-space:nowrap}
.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}.badge-blue{background:#dbeafe;color:#1e40af}.badge-amber{background:#fef3c7;color:#92400e}.badge-purple{background:#ede9fe;color:#5b21b6}
.filter-bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1rem}
.filter-bar label{font-size:.75rem;font-weight:500;color:var(--t3)}
.filter-bar input,.filter-bar select{height:2rem;padding:0 .625rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.75rem}
.session-code{font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:700;letter-spacing:.15em;color:var(--b);text-align:center;background:#f8fafc;border:2px dashed var(--brd);border-radius:.75rem;padding:1rem}
.test-card{border:1px solid var(--brd);border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.test-card h4{font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.radio-group{display:flex;gap:1rem}.radio-option{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.radio-option input[type=radio]{width:1rem;height:1rem;accent-color:var(--b)}
.radio-option label{font-size:.875rem;font-weight:500;cursor:pointer}
.radio-option.in label{color:var(--grn)}.radio-option.out label{color:var(--red)}
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:var(--w);border-bottom:1px solid var(--brd);padding:.75rem 1rem;align-items:center;justify-content:space-between}
.mobile-header .mob-logo{display:flex;align-items:center;gap:.5rem}
.mobile-header .mob-logo .icon{width:2rem;height:2rem;border-radius:.5rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.875rem}
.mobile-header .mob-logo span{font-weight:700;font-size:.8125rem}
.hamburger{background:none;font-size:1.25rem;padding:.25rem}
.report-card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.report-header{padding:2rem;border-bottom:1px solid #f1f5f9}
.report-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
.report-header p{color:var(--t3);font-size:.8125rem}
.report-body{padding:2rem}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem;border-radius:.5rem;border:1px solid var(--brd);margin-bottom:.5rem}
.result-row.pass{background:#f0fdf4;border-color:#bbf7d0}.result-row.fail{background:#fef2f2;border-color:#fecaca}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:1rem;padding:1.5rem;width:100%;max-width:32rem;margin:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.toast{position:fixed;top:1rem;right:1rem;z-index:200;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;box-shadow:0 8px 30px -5px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .3s ease}
.toast.show{transform:translateX(0)}.toast.success{background:#059669;color:#fff}.toast.error{background:#dc2626;color:#fff}.toast.info{background:#0064C8;color:#fff}
@media print{.no-print{display:none!important}body{background:#fff!important}.main{margin-left:0!important;padding:0!important}}
@media(max-width:768px){.sidebar{transform:translateX(-100%);width:16rem}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:1rem}.mobile-header{display:flex!important}.report-body{padding:1rem}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ===== LOGIN PAGE ===== -->
<div id="page-login" class="page login-page active">
  <div style="text-align:center;margin-bottom:2rem;color:#fff">
    <div style="font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;margin-bottom:.5rem">Global Acqua</div>
    <div style="font-size:.75rem;opacity:.6;letter-spacing:.1em;text-transform:uppercase">Sensory Quality Control</div>
  </div>
  <div class="login-card">
    <div class="login-logo">💧</div>
    <h1>Welcome back</h1>
    <p>Sign in to access your sensory analysis dashboard</p>
    <div id="login-error" class="err" style="display:none"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" id="login-btn" style="height:2.75rem">Sign In</button>
    <div style="text-align:center;margin-top:1.5rem;font-size:.75rem;color:var(--t4)">Developed by <b>Mr Saila Ruidas</b> in collaboration with <b>Emergent Lab</b></div>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="page-app" class="page">
  <div class="mobile-header">
    <div class="mob-logo"><div class="icon">💧</div><span>Global Acqua</span></div>
    <button class="hamburger" id="hamburger-btn">☰</button>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="icon">💧</div>
      <div><h2>Global Acqua</h2><span id="sidebar-role-label">Panel</span></div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="user-box">
      <div class="avatar" id="sidebar-avatar">A</div>
      <div class="info">
        <div class="name" id="sidebar-name">Admin</div>
        <div class="role" id="sidebar-role-text">Administrator</div>
      </div>
      <button class="btn btn-sm btn-secondary" id="logout-btn" style="margin-left:.5rem;font-size:.6875rem;color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)">Out</button>
    </div>
  </aside>
  <div class="main" id="main-content"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ============================================================
// DATA LAYER
// ============================================================
var DB = {
  _k: 'gaq_db',

  _load: function() {
    try {
      return JSON.parse(localStorage.getItem(this._k)) || { users: [], sessions: [] };
    } catch(e) {
      return { users: [], sessions: [] };
    }
  },

  _save: function(d) {
    localStorage.setItem(this._k, JSON.stringify(d));
  },

  init: function() {
    var d = this._load();
    if (!d.users.length) {
      d.users = [
        { id: uid(), username: 'admin', password: hashPw('admin123'), role: 'admin', createdAt: now() },
        { id: uid(), username: 'Saila Ruidas', password: hashPw('saila123'), role: 'admin', createdAt: now() },
        { id: uid(), username: 'SD', password: hashPw('sd123'), role: 'user', createdAt: now() },
        { id: uid(), username: 'RM', password: hashPw('rm123'), role: 'user', createdAt: now() },
        { id: uid(), username: 'SC', password: hashPw('sc123'), role: 'user', createdAt: now() },
        { id: uid(), username: 'SM', password: hashPw('sm123'), role: 'user', createdAt: now() }
      ];
      this._save(d);
    }
    return d;
  },

  getUsers: function() {
    return this._load().users.map(function(u) {
      var copy = {};
      for (var k in u) copy[k] = u[k];
      copy.password = undefined;
      return copy;
    });
  },

  findUser: function(u, p) {
    var d = this._load();
    for (var i = 0; i < d.users.length; i++) {
      if (d.users[i].username === u && verifyPw(p, d.users[i].password)) {
        return d.users[i];
      }
    }
    return null;
  },

  addUser: function(u, p, r) {
    var d = this._load();
    for (var i = 0; i < d.users.length; i++) {
      if (d.users[i].username === u) return false;
    }
    d.users.push({ id: uid(), username: u, password: hashPw(p), role: r, createdAt: now() });
    this._save(d);
    return true;
  },

  deleteUser: function(u) {
    var d = this._load();
    d.users = d.users.filter(function(x) { return x.username !== u; });
    this._save(d);
  },

  getSessions: function(role, user) {
    var d = this._load();
    if (role === 'admin') return d.sessions;
    return d.sessions.filter(function(s) { return s.createdBy === user; });
  },

  getAllSessions: function() {
    return this._load().sessions;
  },

  findSession: function(code) {
    var d = this._load();
    for (var i = 0; i < d.sessions.length; i++) {
      if (d.sessions[i].sessionCode === code) return d.sessions[i];
    }
    return null;
  },

  createSession: function(code, count, type, user) {
    var d = this._load();
    var s = {
      id: uid(),
      sessionCode: code,
      status: 'in_progress',
      targetPanelistCount: count,
      testType: type || 'regular',
      ballots: [],
      createdBy: user,
      createdAt: now(),
      completedAt: null,
      verifiedBy: null,
      verifiedByName: null,
      verificationSignature: null
    };
    d.sessions.push(s);
    this._save(d);
    return s;
  },

  submitBallot: function(code, ballot) {
    var d = this._load();
    var s = null;
    for (var i = 0; i < d.sessions.length; i++) {
      if (d.sessions[i].sessionCode === code) { s = d.sessions[i]; break; }
    }
    if (!s) return null;
    s.ballots.push(ballot);
    if (s.ballots.length >= s.targetPanelistCount) {
      s.status = 'completed';
      s.completedAt = now();
    }
    this._save(d);
    return s;
  },

  deleteSession: function(code) {
    var d = this._load();
    d.sessions = d.sessions.filter(function(x) { return x.sessionCode !== code; });
    this._save(d);
  }
};

// ============================================================
// HELPERS
// ============================================================
function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function now() {
  return new Date().toISOString();
}

function hashPw(p) {
  var h = 0;
  for (var i = 0; i < p.length; i++) {
    h = ((h << 5) - h) + p.charCodeAt(i);
    h = h | 0;
  }
  return 'h' + h;
}

function verifyPw(p, h) {
  return hashPw(p) === h;
}

function fmtDate(s) {
  if (!s) return 'N/A';
  return new Date(s).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function fmtDateTime(s) {
  if (!s) return 'N/A';
  return new Date(s).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escH(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function hideModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

var _toastTimer = null;
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3500);
}

function genCode() {
  var A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var c = 'GAQ-';
  for (var i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}

function badgeColorForCode(code) {
  var map = {
    'Control': '#e5e7eb', 'Yellow': '#fef08a', 'Brown': '#a16207',
    'Blue': '#3b82f6', 'Green': '#22c55e', 'Red': '#ef4444', 'Purple': '#a855f7'
  };
  return map[code] || '#ccc';
}

function badgeTextForCode(code) {
  return (code === 'Control' || code === 'Yellow' || code === 'Green') ? '#000' : '#fff';
}

// ============================================================
// STATE
// ============================================================
var currentUser = null;
var currentView = 'dashboard';
var _joinCode = '';
var _testSelect = false;
var _activeCode = '';
var _ballotNum = 1;
var _ballotInitial = null;
var _selectedTest = 'regular';
var _viewingSession = null;
var _sSearch = '';
var _sDateFrom = '';
var _sDateTo = '';
var _sStatus = 'all';
var _genType = 'regular';
var _genCount = '3';
var _genCode = '';

// ============================================================
// AUTH
// ============================================================
function doLogin() {
  var u = document.getElementById('login-user').value.trim();
  var p = document.getElementById('login-pass').value;
  if (!u || !p) {
    document.getElementById('login-error').textContent = 'Please enter username and password';
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  var user = DB.findUser(u, p);
  if (!user) {
    document.getElementById('login-error').textContent = 'Incorrect username or password';
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  currentUser = { username: user.username, role: user.role };
  document.getElementById('login-error').style.display = 'none';
  showApp();
}

function doLogout() {
  currentUser = null;
  currentView = 'dashboard';
  document.getElementById('page-app').classList.remove('active');
  document.getElementById('page-login').classList.add('active');
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

// ============================================================
// APP SHELL
// ============================================================
function showApp() {
  document.getElementById('page-login').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
  document.getElementById('sidebar-name').textContent = currentUser.username;
  document.getElementById('sidebar-avatar').textContent = currentUser.username.charAt(0).toUpperCase();
  if (currentUser.role === 'admin') {
    document.getElementById('sidebar-role-label').textContent = 'Admin Panel';
    document.getElementById('sidebar-role-text').textContent = 'Administrator';
  } else {
    document.getElementById('sidebar-role-label').textContent = 'Sensory Panel';
    document.getElementById('sidebar-role-text').textContent = 'Panelist';
  }
  buildNav();
  navigateTo('dashboard');
  toast('Welcome, ' + currentUser.username + '!', 'success');
}

function buildNav() {
  var nav = document.getElementById('sidebar-nav');
  if (currentUser.role === 'admin') {
    nav.innerHTML =
      '<a data-nav="dashboard">📊 Dashboard</a>' +
      '<a data-nav="users">👥 User Management</a>' +
      '<a data-nav="sessions">📋 All Sessions</a>' +
      '<a data-nav="generate">🔑 Generate Code</a>' +
      '<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)">' +
      '<div style="font-size:.625rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;padding:0 1rem;margin-bottom:.5rem">Reports</div>' +
      '<a data-action="daily">📅 Daily Summary</a>' +
      '<a data-action="blind">🎯 Blind Test Summary</a>' +
      '<a data-action="proficiency">⭐ Proficiency Summary</a></div>';
  } else {
    nav.innerHTML =
      '<a data-nav="dashboard">📊 Dashboard</a>' +
      '<a data-nav="active">📋 Active Session</a>';
  }
  // Attach nav click listeners via event delegation
  nav.querySelectorAll('a[data-nav]').forEach(function(a) {
    a.addEventListener('click', function() {
      navigateTo(a.getAttribute('data-nav'));
    });
  });
  nav.querySelectorAll('a[data-action]').forEach(function(a) {
    a.addEventListener('click', function() {
      openReport(a.getAttribute('data-action'));
    });
  });
}

function navigateTo(view) {
  currentView = view;
  document.querySelectorAll('.sidebar nav a').forEach(function(a) { a.classList.remove('active'); });
  var el = document.querySelector('.sidebar nav a[data-nav="' + view + '"]');
  if (el) el.classList.add('active');
  renderView();
  document.getElementById('sidebar').classList.remove('open');
}

function renderView() {
  var m = document.getElementById('main-content');
  switch (currentView) {
    case 'dashboard':
      m.innerHTML = currentUser.role === 'admin' ? renderAdminDash() : renderUserDash();
      attachDashboardListeners();
      break;
    case 'users':
      m.innerHTML = renderUsers();
      break;
    case 'sessions':
      m.innerHTML = renderSessions();
      attachSessionFilterListeners();
      break;
    case 'generate':
      m.innerHTML = renderGenerate();
      attachGenerateListeners();
      break;
    case 'active':
      m.innerHTML = renderActive();
      break;
    case 'ballot':
      m.innerHTML = renderBallot();
      setupRadioListeners();
      break;
    case 'report':
      m.innerHTML = renderSessionReport();
      break;
    default:
      m.innerHTML = renderUserDash();
      attachDashboardListeners();
  }
}

function generateCode() {
  var c = genCode();
  while (DB.findSession(c)) c = genCode();
  DB.createSession(c, parseInt(_genCount), _genType, currentUser.username);
  _genCode = c;
  toast('Session ' + c + ' created!', 'success');
  renderView();
}

function copyCode(code) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(function() { toast('Code copied!', 'info'); });
  } else {
    toast('Code: ' + code, 'info');
  }
}

// ============================================================
// SESSION FLOW
// ============================================================
function startSession(count, testType) {
  testType = testType || 'regular';
  var c = genCode();
  while (DB.findSession(c)) c = genCode();
  DB.createSession(c, count, testType, currentUser.username);
  _activeCode = c;
  _ballotNum = 1;
  _ballotInitial = null;
  _selectedTest = testType;
  toast('Session ' + c + ' created!', 'success');
  currentView = 'ballot';
  renderView();
}

function joinSession() {
  var inputEl = document.getElementById('join-code-input');
  var rawCode = inputEl ? inputEl.value : _joinCode;
  var code = rawCode.trim().toUpperCase();
  if (!code) {
    toast('Enter a session code', 'error');
    return;
  }
  var s = DB.findSession(code);
  if (!s) {
    toast('Session not found. Check the code and try again.', 'error');
    return;
  }
  if (s.status === 'completed') {
    toast('This session is already completed', 'error');
    return;
  }
  _activeCode = code;
  _ballotNum = s.ballots.length + 1;
  _selectedTest = s.testType || 'regular';
  if (s.ballots.length > 0) {
    var f = s.ballots[0];
    _ballotInitial = {
      productType: f.productType,
      otherProductType: f.otherProductType,
      productVariant: f.productVariant,
      otherProductVariant: f.otherProductVariant,
      productCode: f.productCode,
      dateOfMfg: f.dateOfMfg,
      controlSampleCode: f.controlSampleCode,
      productTime: f.productTime
    };
  } else {
    _ballotInitial = null;
  }
  _joinCode = '';
  currentView = 'ballot';
  renderView();
  toast('Joined session ' + code + '!', 'success');
}

function viewSession(code) {
  var s = DB.findSession(code);
  if (!s) { toast('Session not found', 'error'); return; }
  _viewingSession = s;
  currentView = 'report';
  renderView();
}

function submitBallot(data) {
  data.signature = data.signature || null;
  var updated = DB.submitBallot(_activeCode, data);
  if (!updated) {
    toast('Failed to submit ballot', 'error');
    return;
  }
  if (updated.status === 'completed') {
    _viewingSession = updated;
    currentView = 'report';
    renderView();
    toast('Session completed!', 'success');
  } else {
    _ballotNum = updated.ballots.length + 1;
    if (updated.ballots.length === 1 && _selectedTest === 'regular') {
      _ballotInitial = {
        productType: data.productType,
        otherProductType: data.otherProductType,
        productVariant: data.productVariant,
        otherProductVariant: data.otherProductVariant,
        productCode: data.productCode,
        dateOfMfg: data.dateOfMfg,
        controlSampleCode: data.controlSampleCode,
        productTime: data.productTime
      };
    }
    renderView();
    toast('Ballot submitted! Waiting for ' + (updated.targetPanelistCount - updated.ballots.length) + ' more.', 'success');
  }
}

function renderSessionReport() {
  var s = _viewingSession;
  if (!s) return '<p>No session</p>';
  var ballots = s.ballots || [];
  var total = s.targetPanelistCount;
  var pct = Math.min(100, Math.round((ballots.length / total) * 100));
  var isBlind = s.testType === 'blind' || s.testType === 'proficiency';

  var checks = 0, ins = 0;
  var cat = { Appearance: { i: 0, t: 0 }, Odour: { i: 0, t: 0 }, Taste: { i: 0, t: 0 } };
  ballots.forEach(function(b) {
    ['appearance', 'odour', 'taste'].forEach(function(k) {
      if (b[k] && b[k].status) {
        var lk = k === 'appearance' ? 'Appearance' : k === 'odour' ? 'Odour' : 'Taste';
        cat[lk].t++;
        checks++;
        if (b[k].status === 'IN') { cat[lk].i++; ins++; }
      }
    });
  });
  var passPct = checks ? Math.round((ins / checks) * 100) : null;
  var allPassed = passPct === 100;

  var html = '<div style="max-width:50rem;margin:0 auto">';

  // Top bar
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem">';
  html += '<button class="btn btn-sm btn-secondary" onclick="navigateTo(\'dashboard\')">← Dashboard</button>';
  html += '<button class="btn btn-sm btn-primary" onclick="window.print()">🖨️ Print</button></div>';

  // Stats
  var qColor = allPassed ? 'var(--grn)' : 'var(--red)';
  var qBg = allPassed ? '#f0fdf4' : '#fef2f2';
  var qLabel = passPct !== null ? passPct + '%' : '—';
  html += '<div class="grid grid-3" style="margin-bottom:1.5rem">';
  html += '<div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:var(--b)">👥</div><div><div class="stat-val">' + ballots.length + '/' + total + '</div><div class="stat-lbl">Panelists (' + pct + '%)</div></div></div>';
  html += '<div class="stat-card"><div class="stat-icon" style="background:' + qBg + ';color:' + qColor + '">✅</div><div><div class="stat-val" style="color:' + qColor + '">' + qLabel + '</div><div class="stat-lbl">Quality Rate</div></div></div>';
  html += '<div class="stat-card"><div class="stat-icon" style="background:#f5f3ff;color:var(--pur)">📋</div><div><div class="stat-val">' + (s.testType || 'regular') + '</div><div class="stat-lbl">Test Type</div></div></div>';
  html += '</div>';

  // Report card
  var reportTitle = s.testType === 'blind' ? 'Sensory Blind Test Report' : s.testType === 'proficiency' ? 'Proficiency Test Report' : 'Sensory Evaluation Report';
  html += '<div class="report-card"><div class="report-header">';
  html += '<h1>' + reportTitle + '</h1>';
  html += '<p>Global Acqua Pvt Ltd · Sensory Quality Control</p>';
  html += '<div style="display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap">';
  html += '<div class="badge badge-blue" style="font-family:\'Space Grotesk\',monospace;font-size:.875rem;padding:.5rem 1rem">' + s.sessionCode + '</div>';
  html += '<div style="font-size:.8125rem;color:var(--t3)">Completed: ' + fmtDateTime(s.completedAt || s.createdAt) + '</div>';
  html += '</div></div>';

  html += '<div class="report-body">';

  // Category breakdown
  var catNames = ['Appearance', 'Odour', 'Taste'];
  for (var ci2 = 0; ci2 < catNames.length; ci2++) {
    var cname = catNames[ci2];
    var cv = cat[cname];
    if (cv.t === 0) continue;
    var cp = Math.round((cv.i / cv.t) * 100);
    var cpColor = cp === 100 ? 'var(--grn)' : 'var(--b)';
    html += '<div style="margin-bottom:.75rem">';
    html += '<div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.25rem">';
    html += '<span style="font-weight:600">' + cname + '</span>';
    html += '<span style="font-weight:700;color:' + cpColor + '">' + cp + '% IN (' + cv.i + '/' + cv.t + ')</span></div>';
    html += '<div style="height:.5rem;background:#f1f5f9;border-radius:999px;overflow:hidden">';
    html += '<div style="height:100%;width:' + cp + '%;background:' + cpColor + ';border-radius:999px"></div></div></div>';
  }

  html += '<h3 style="font-family:\'Space Grotesk\',sans-serif;font-size:.875rem;font-weight:600;margin:1.5rem 0 1rem;color:var(--t2)">Panelist Evaluations</h3>';

  // Each ballot
  for (var bi = 0; bi < ballots.length; bi++) {
    var b = ballots[bi];
    var panelistBg = isBlind ? '#f5f3ff' : '#eff6ff';
    var panelistBorder = isBlind ? '#ede9fe' : '#dbeafe';
    var panelistColor = isBlind ? 'var(--pur)' : 'var(--b)';

    html += '<div style="border:1px solid var(--brd);border-radius:.75rem;margin-bottom:1rem;overflow:hidden">';
    html += '<div style="background:' + panelistBg + ';padding:.75rem 1rem;border-bottom:1px solid ' + panelistBorder + ';display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">';

    html += '<span style="font-weight:600">' + escH(b.panelistName || 'Panelist ' + (bi + 1)) + '</span></div>';
    if (b.testingCompletionDate) {
      html += '<span style="font-size:.6875rem;color:var(--t3)">' + b.testingCompletionDate + ' ' + (b.testingCompletionTime || '') + '</span>';
    }
    html += '</div>';

    html += '<div style="padding:1rem">';

    if (isBlind && b.samples) {
      // Blind/proficiency samples table
      html += '<table style="width:100%"><thead><tr style="background:#fafbfc">';
      html += '<th style="font-size:.625rem">Sl</th><th style="font-size:.625rem">Color Code</th><th style="font-size:.625rem">Result</th><th style="font-size:.625rem">OFF Note</th>';

        html += '<td><span class="badge ' + (sm.status === 'IN' ? 'badge-green' : 'badge-red') + '">' + resultLabel + '</span></td>';

        html += '<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Type</div><div style="font-size:.8125rem;font-weight:600">' + escH(ptDisplay) + '</div></div>';
      }
      if (b.productCode) {
        html += '<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Code</div><div style="font-size:.8125rem;font-weight:600;font-family:monospace">' + escH(b.productCode) + '</div></div>';
      }
      if (b.dateOfMfg) {
        html += '<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Mfg Date</div><div style="font-size:.8125rem;font-weight:600">' + b.dateOfMfg + '</div></div>';
      }
      html += '</div>';

      // Test results
      var testKeys = ['appearance', 'odour'];
      if (b.productType !== 'Raw Water') testKeys.push('taste');
      for (var ti = 0; ti < testKeys.length; ti++) {
        var tk = testKeys[ti];
        if (!b[tk]) continue;
        var rowClass = b[tk].status === 'IN' ? 'pass' : 'fail';
        var badgeClass = b[tk].status === 'IN' ? 'badge-green' : 'badge-red';
        var label = tk.charAt(0).toUpperCase() + tk.slice(1);
        html += '<div class="result-row ' + rowClass + '">';
        html += '<span style="font-size:.8125rem;font-weight:500">' + label + '</span>';
        html += '<div style="display:flex;align-items:center;gap:.5rem">';
        html += '<span class="badge ' + badgeClass + '">' + b[tk].status + '</span>';
        if (b[tk].status === 'OUT') {
          var reasonText = b[tk].reason === 'Other' ? 'Other' : b[tk].reason;
          html += '<span style="font-size:.75rem;color:var(--red)">' + escH(reasonText) + '</span>';
        }
        html += '</div></div>';
      }

      // Remarks
      if (b.remarks) {
        html += '<div style="margin-top:.5rem;background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Remarks</div><div style="font-size:.8125rem">' + escH(b.remarks) + '</div></div>';
      }
    }

    html += '</div></div>';
  }

  html += '<div style="text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid #f1f5f9;font-size:.75rem;color:var(--t4)">Generated by <b>Global Acqua Pvt Ltd</b> · Sensory Analysis System</div>';
  html += '</div></div></div>';
  return html;
}

function renderActive() {
  var s = DB.findSession(_activeCode);
  if (!s) {
    return '<p>No active session. <a href="#" onclick="navigateTo(\'dashboard\');return false" style="color:var(--b)">Go to Dashboard</a></p>';
  }
  if (s.status === 'completed') {
    _viewingSession = s;
    currentView = 'report';
    return renderSessionReport();
  }
  currentView = 'ballot';
  return renderBallot();
}

// ============================================================
// ADMIN REPORTS (Modal)
// ============================================================
function openReport(type) {
  var sessions = DB.getAllSessions();
  var filtered;
  if (type === 'daily') {
    filtered = sessions.filter(function(s) { return (!s.testType || s.testType === 'regular') && s.status === 'completed'; });
  } else if (type === 'blind') {
    filtered = sessions.filter(function(s) { return s.testType === 'blind' && s.status === 'completed'; });
  } else {
    filtered = sessions.filter(function(s) { return s.testType === 'proficiency' && s.status === 'completed'; });
  }

  var title = type === 'daily' ? 'Daily Summary' : type === 'blind' ? 'Blind Test Summary' : 'Proficiency Summary';

  var html = '<div style="max-height:70vh;overflow-y:auto">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">';
  html += '<h3 style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:1.125rem">' + title + '</h3>';
  html += '<button class="btn btn-sm btn-secondary" onclick="hideModal()">✕</button></div>';
  html += '<div class="table-wrap"><table style="width:100%;font-size:.8125rem"><thead><tr>';
  html += '<th>Code</th><th>Product</th><th>Code</th><th>Panelists</th><th>Result</th><th>Date</th>';
  html += '</tr></thead><tbody>';

  if (filtered.length) {
    for (var ri = 0; ri < filtered.length; ri++) {
      var sess = filtered[ri];
      var fb = sess.ballots[0] || {};
      var allIn = sess.ballots.every(function(x) {
        return (x.appearance && x.appearance.status === 'IN') &&
               (x.odour && x.odour.status === 'IN') &&
               ((x.taste && x.taste.status === 'IN') || x.productType === 'Raw Water');
      });
      var ptDisplay = fb.productType === 'Other' ? fb.otherProductType : (fb.productType || '-');
      var badgeClass = allIn ? 'badge-green' : 'badge-red';
      var badgeLabel = allIn ? 'IN' : 'OUT';
      html += '<tr>';
      html += '<td style="font-family:monospace;font-weight:700;color:var(--b)">' + sess.sessionCode + '</td>';
      html += '<td>' + escH(ptDisplay) + '</td>';
      html += '<td>' + escH(fb.productCode || '-') + '</td>';
      html += '<td>' + sess.ballots.length + '/' + sess.targetPanelistCount + '</td>';
      html += '<td><span class="badge ' + badgeClass + '">' + badgeLabel + '</span></td>';
      html += '<td>' + fmtDate(sess.completedAt) + '</td>';
      html += '</tr>';
    }
  } else {
    html += '<tr><td colspan="6" style="text-align:center;color:var(--t4);padding:2rem">No completed sessions yet</td></tr>';
  }

  html += '</tbody></table></div></div>';
  showModal(html);
}

// ============================================================
// INITIALIZATION — All event listeners attached here
// ============================================================
DB.init();

// Login button
document.getElementById('login-btn').addEventListener('click', doLogin);

// Enter key on login fields
document.getElementById('login-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('login-user').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('login-pass').focus();
});

// Logout button
document.getElementById('logout-btn').addEventListener('click', doLogout);

// Hamburger menu
document.getElementById('hamburger-btn').addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('open');
});

// Modal overlay click to close
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) hideModal();
});

// We need to re-attach listeners after renderView() changes innerHTML.
// Override renderView to call attachUserDashListeners after rendering user dashboard.
var _origRenderView = renderView;
// Use a MutationObserver or just re-attach after each render.
// Simplest: hook into renderView calls for user dashboard.
(function() {
  var origNav = navigateTo;
  // Monkey-patch renderView to attach user dash listeners
  var origRV = window.renderView;
  window.renderView = function() {
    origRV();
    if (currentView === 'dashboard' && currentUser && currentUser.role !== 'admin') {
      attachUserDashListeners();
    }
    if (currentView === 'ballot') {
      attachBallotListeners();
    }
  };
})();

function attachBallotListeners() {
  var form = document.getElementById('ballot-form');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var s = DB.findSession(_activeCode);
    if (!s) return;
    if (s.testType === 'blind' || s.testType === 'proficiency') {
      submitBlindBallot();
    } else {
      submitRegularBallot();
    }
  });
  // Attach product type change listeners
  var ptSelect = document.getElementById('pt-select');
  if (ptSelect) {
    ptSelect.addEventListener('change', function() {
      toggleOtherType(this);
      toggleVariant(this);
    });
  }
  // Attach radio listeners
  setupRadioListeners();
}

</script>
