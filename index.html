<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Global Acqua - Sensory Analysis</title>
<meta name="description" content="Sensory Quality Control System">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--d:#0a1628;--n:#0d2137;--b:#0064C8;--s:#009DE0;--g:#f0f4f8;--w:#fff;--t1:#1a202c;--t2:#4a5568;--t3:#718096;--t4:#a0aec0;--brd:#e2e8f0;--red:#dc2626;--grn:#059669;--amb:#d97706;--pur:#7c3aed}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--g);color:var(--t1);line-height:1.6}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer;border:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 3px rgba(0,100,200,.1)}
.page{display:none;min-height:100vh}.page.active{display:flex}
.login-page{background:linear-gradient(160deg,var(--d),#0d2137 35%,#0f3460 70%,#16213e);align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--w);border-radius:1.25rem;padding:2.5rem;width:100%;max-width:26rem;box-shadow:0 25px 60px -12px rgba(0,0,0,.4)}
.login-logo{width:3rem;height:3rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;font-size:1.5rem;color:#fff}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.625rem;font-weight:700;margin-bottom:.25rem}
.login-card p{color:var(--t3);font-size:.875rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}.field label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.375rem}
.field input,.field select,.field textarea{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.875rem;transition:all .15s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:.625rem;font-weight:600;font-size:.875rem;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--b),var(--s));color:#fff;box-shadow:0 4px 14px -3px rgba(0,100,200,.4)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--w);color:var(--t2);border:1px solid var(--brd)}.btn-secondary:hover{background:#f7fafc}
.btn-sm{padding:.375rem .75rem;font-size:.75rem;border-radius:.5rem}
.btn-full{width:100%}
.btn-danger{background:#fee2e2;color:var(--red);border:1px solid #fecaca}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:.5rem;padding:.75rem;color:var(--red);font-size:.8125rem;margin-bottom:1rem}
.sidebar{width:16rem;background:linear-gradient(180deg,var(--d),var(--n) 50%,#0f3460);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s}
.sidebar .logo{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .logo .icon{width:2.5rem;height:2.5rem;border-radius:.75rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.sidebar .logo h2{font-family:'Space Grotesk',sans-serif;font-size:1.125rem;font-weight:700}
.sidebar .logo span{font-size:.625rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em}
.sidebar nav{flex:1;padding:1rem;display:flex;flex-direction:column;gap:.25rem;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:rgba(255,255,255,.5);transition:all .2s;text-decoration:none;cursor:pointer}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:#fff}
.sidebar .user-box{padding:1rem;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.75rem}
.sidebar .user-box .avatar{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.sidebar .user-box .info{flex:1;min-width:0}
.sidebar .user-box .name{font-size:.8125rem;font-weight:500}
.sidebar .user-box .role{font-size:.625rem;color:rgba(255,255,255,.5)}
.main{flex:1;margin-left:16rem;padding:2rem}
.main-header{margin-bottom:2rem}.main-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}.main-header p{font-size:.8125rem;color:var(--t3);margin-top:.25rem}
.card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:.75rem;background:#fafbfc}
.card-header h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.875rem}
.card-body{padding:1.5rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--w);border:1px solid var(--brd);border-radius:.75rem;padding:1.25rem;display:flex;align-items:center;gap:.75rem}
.stat-card .si{width:2.5rem;height:2.5rem;border-radius:.625rem;display:flex;align-items:center;justify-content:center;font-size:1.125rem}
.stat-card .sv{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;line-height:1}
.stat-card .sl{font-size:.6875rem;color:var(--t3);margin-top:.25rem}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8125rem}
th{background:var(--d);color:#fff;padding:.75rem;text-align:left;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:.625rem .75rem;border-bottom:1px solid #f1f5f9}tr:hover{background:#f8fafc}
.badge{display:inline-flex;padding:.25rem .625rem;border-radius:999px;font-size:.6875rem;font-weight:600;white-space:nowrap}
.bg{background:#d1fae5;color:#065f46}.br{background:#fee2e2;color:#991b1b}.bb{background:#dbeafe;color:#1e40af}.ba{background:#fef3c7;color:#92400e}.bp{background:#ede9fe;color:#5b21b6}
.filter-bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding:1rem 1.5rem}
.filter-bar label{font-size:.75rem;font-weight:500;color:var(--t3)}
.filter-bar input,.filter-bar select{height:2rem;padding:0 .625rem;border:1px solid var(--brd);border-radius:.5rem;font-size:.75rem}
.session-code{font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:700;letter-spacing:.15em;color:var(--b);text-align:center;background:#f8fafc;border:2px dashed var(--brd);border-radius:.75rem;padding:1rem}
.test-card{border:1px solid var(--brd);border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.test-card h4{font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.radio-group{display:flex;gap:1rem}.radio-option{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.radio-option input[type=radio]{width:1rem;height:1rem;accent-color:var(--b)}
.radio-option label{font-size:.875rem;font-weight:500;cursor:pointer}
.ri label{color:var(--grn)}.ro label{color:var(--red)}
.report-card{background:var(--w);border:1px solid var(--brd);border-radius:1rem;overflow:hidden}
.report-header{padding:2rem;border-bottom:1px solid #f1f5f9}
.report-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
.report-header p{color:var(--t3);font-size:.8125rem}
.report-body{padding:2rem}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem;border-radius:.5rem;border:1px solid var(--brd);margin-bottom:.5rem}
.result-row.pass{background:#f0fdf4;border-color:#bbf7d0}.result-row.fail{background:#fef2f2;border-color:#fecaca}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:1rem;padding:1.5rem;width:100%;max-width:40rem;margin:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.toast{position:fixed;top:1rem;right:1rem;z-index:200;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;color:#fff;box-shadow:0 8px 30px -5px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}.toast.ok{background:#059669}.toast.err2{background:#dc2626}.toast.inf{background:#0064C8}
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:var(--w);border-bottom:1px solid var(--brd);padding:.75rem 1rem;align-items:center;justify-content:space-between}
.hamburger{background:none;font-size:1.25rem;padding:.25rem}
@media print{.no-print{display:none!important}body{background:#fff!important}.main{margin-left:0!important;padding:0!important}}
@media(max-width:768px){.g2,.g3,.g4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);width:16rem}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:1rem}.mobile-header{display:flex!important}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- LOGIN PAGE -->
<div id="page-login" class="page login-page active">
  <div style="text-align:center;margin-bottom:2rem;color:#fff">
    <div style="font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;margin-bottom:.5rem">Global Acqua</div>
    <div style="font-size:.75rem;opacity:.6;letter-spacing:.1em;text-transform:uppercase">Sensory Quality Control</div>
  </div>
  <div class="login-card">
    <div class="login-logo">💧</div>
    <h1>Welcome back</h1>
    <p>Sign in to access your sensory analysis dashboard</p>
    <div id="login-error" class="err" style="display:none"></div>
    <div class="field"><label>Username</label><input type="text" id="login-user" placeholder="Enter username"></div>
    <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="Enter password"></div>
    <button class="btn btn-primary btn-full" id="login-btn" style="height:2.75rem">Sign In</button>
    <div style="margin-top:1rem;padding:.75rem;background:#f0f4f8;border-radius:.5rem;font-size:.6875rem;color:var(--t3)">
      <b>Demo Accounts:</b><br>
      Admin: admin / admin123<br>
      User: SD / sd123
    </div>
    <div style="text-align:center;margin-top:1rem;font-size:.75rem;color:var(--t4)">Developed by <b>Mr Saila Ruidas</b> with <b>Emergent Lab</b></div>
  </div>
</div>

<!-- APP SHELL -->
<div id="page-app" class="page">
  <div class="mobile-header"><div style="display:flex;align-items:center;gap:.5rem"><div style="width:2rem;height:2rem;border-radius:.5rem;background:linear-gradient(135deg,var(--b),var(--s));display:flex;align-items:center;justify-content:center;color:#fff">💧</div><span style="font-weight:700;font-size:.8125rem">Global Acqua</span></div><button class="hamburger" id="hamburger-btn">☰</button></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo"><div class="icon">💧</div><div><h2>Global Acqua</h2><span id="sr-label">Panel</span></div></div>
    <nav id="snav"></nav>
    <div class="user-box">
      <div class="avatar" id="savatar">A</div>
      <div class="info"><div class="name" id="sname">Admin</div><div class="role" id="srole">Administrator</div></div>
      <button class="btn btn-sm" id="logout-btn" style="color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)">Out</button>
    </div>
  </aside>
  <div class="main" id="mc"></div>
</div>

<div class="modal-overlay" id="mover"><div class="modal" id="mcont"></div></div>

<script>
// NO IIFE - simple global functions
var _user = null;
var _view = 'dashboard';
var _ac = '', _bn = 1, _bi = null, _st = 'regular', _vs = null;
var _jc = '', _ts = false;
var _ss = '', _sf = '', _sto = '', _sst = 'all';
var _gt = 'regular', _gc = '3', _gcodeVal = '';

function _el(id) { return document.getElementById(id); }

function _log(msg) { console.log('[GAQ] ' + msg); }

// ===== DB =====
var SK = 'gaq_db';

function _load() {
  try { return JSON.parse(localStorage.getItem(SK)) || { users: [], sessions: [] }; }
  catch(e) { return { users: [], sessions: [] }; }
}

function _save(d) { localStorage.setItem(SK, JSON.stringify(d)); }

function _hash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h | 0; }
  return 'h' + h;
}

function _id() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch(e) {}
  return 'r' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function _now() { return new Date().toISOString(); }

function _esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function _fmt(s) { return s ? new Date(s).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'N/A'; }
function _fmtDt(s) { return s ? new Date(s).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'N/A'; }

function _toast(msg, type) {
  var t = _el('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type === 'error' ? 'err2' : type === 'info' ? 'inf' : 'ok') + ' show';
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.classList.remove('show'); }, 3500);
}

function _gcode() {
  var A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', c = 'GAQ-';
  for (var i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}

function _cbg(c) { return ({Control:'#e5e7eb',Yellow:'#fef08a',Brown:'#a16207',Blue:'#3b82f6',Green:'#22c55e',Red:'#ef4444',Purple:'#a855f7'})[c] || '#ccc'; }
function _ct(c) { return (c === 'Control' || c === 'Yellow' || c === 'Green') ? '#000' : '#fff'; }

// ===== INIT =====
function _init() {
  var d = _load();
  if (!d.users || !d.users.length) {
    d.users = [
      { id: _id(), username: 'admin', password: _hash('admin123'), role: 'admin', createdAt: _now() },
      { id: _id(), username: 'Saila Ruidas', password: _hash('saila123'), role: 'admin', createdAt: _now() },
      { id: _id(), username: 'SD', password: _hash('sd123'), role: 'user', createdAt: _now() },
      { id: _id(), username: 'RM', password: _hash('rm123'), role: 'user', createdAt: _now() },
      { id: _id(), username: 'SC', password: _hash('sc123'), role: 'user', createdAt: _now() },
      { id: _id(), username: 'SM', password: _hash('sm123'), role: 'user', createdAt: _now() }
    ];
    d.sessions = [];
    _save(d);
    _log('Users created: ' + d.users.length);
  }
  _log('DB ready. Users: ' + d.users.length);
}

// ===== AUTH =====
function doLogin() {
  _log('Login attempt...');
  var u = _el('login-user').value.trim();
  var p = _el('login-pass').value;
  _log('Username: "' + u + '", Password length: ' + p.length);

  if (!u || !p) {
    _el('login-error').textContent = 'Please enter username and password';
    _el('login-error').style.display = 'block';
    _log('Login FAILED: empty fields');
    return;
  }

  var d = _load();
  var found = null;
  for (var i = 0; i < d.users.length; i++) {
    if (d.users[i].username === u && d.users[i].password === _hash(p)) {
      found = d.users[i];
      break;
    }
  }

  if (!found) {
    _el('login-error').textContent = 'Incorrect username or password';
    _el('login-error').style.display = 'block';
    _log('Login FAILED: user not found');
    return;
  }

  _user = { username: found.username, role: found.role };
  _el('login-error').style.display = 'none';
  _log('Login SUCCESS: ' + _user.username + ' (' + _user.role + ')');
  _showApp();
}

function doLogout() {
  _user = null;
  _view = 'dashboard';
  _el('page-app').classList.remove('active');
  _el('page-login').classList.add('active');
  _el('login-user').value = '';
  _el('login-pass').value = '';
}

// ===== APP SHELL =====
function _showApp() {
  _el('page-login').classList.remove('active');
  _el('page-app').classList.add('active');
  _el('sname').textContent = _user.username;
  _el('savatar').textContent = _user.username.charAt(0).toUpperCase();
  _el('sr-label').textContent = _user.role === 'admin' ? 'Admin Panel' : 'Sensory Panel';
  _el('srole').textContent = _user.role === 'admin' ? 'Administrator' : 'Panelist';
  _buildNav();
  _navTo('dashboard');
  _toast('Welcome, ' + _user.username + '!', 'ok');
}

function _buildNav() {
  var n = _el('snav');
  if (_user.role === 'admin') {
    n.innerHTML = '<a onclick="_navTo(\'dashboard\')">📊 Dashboard</a>' +
      '<a onclick="_navTo(\'users\')">👥 User Management</a>' +
      '<a onclick="_navTo(\'sessions\')">📋 All Sessions</a>' +
      '<a onclick="_navTo(\'generate\')">🔑 Generate Code</a>' +
      '<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)">' +
      '<div style="font-size:.625rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;padding:0 1rem;margin-bottom:.5rem">Reports</div>' +
      '<a onclick="_openRpt(\'daily\')">📅 Daily Summary</a>' +
      '<a onclick="_openRpt(\'blind\')">🎯 Blind Test Summary</a>' +
      '<a onclick="_openRpt(\'proficiency\')">⭐ Proficiency Summary</a></div>';
  } else {
    n.innerHTML = '<a onclick="_navTo(\'dashboard\')">📊 Dashboard</a>' +
      '<a onclick="_navTo(\'active\')">📋 Active Session</a>';
  }
}

function _navTo(v) {
  _view = v;
  var els = document.querySelectorAll('.sidebar nav a');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('active');
  _render();
  _el('sidebar').classList.remove('open');
}

function _render() {
  var m = _el('mc');
  switch (_view) {
    case 'dashboard': m.innerHTML = _user.role === 'admin' ? _rAdmin() : _rUser(); break;
    case 'users': m.innerHTML = _rUsers(); break;
    case 'sessions': m.innerHTML = _rSessions(); break;
    case 'generate': m.innerHTML = _rGen(); break;
    case 'active': m.innerHTML = _rActive(); break;
    case 'ballot': m.innerHTML = _rBallot(); _attachRadio(); break;
    case 'report': m.innerHTML = _rReport(); break;
    default: m.innerHTML = _user.role === 'admin' ? _rAdmin() : _rUser();
  }
}

// ===== ADMIN DASHBOARD =====
function _rAdmin() {
  var ss = _load().sessions || [];
  var done = ss.filter(function(s) { return s.status === 'completed'; });
  var today = new Date().toDateString();
  var tn = done.filter(function(s) { return s.createdAt && new Date(s.createdAt).toDateString() === today; }).length;
  var bl = ss.reduce(function(a, s) { return a + s.ballots.length; }, 0);

  var h = '<div class="main-header"><h1>Admin Dashboard</h1><p>Welcome, ' + _esc(_user.username) + '</p></div>';
  h += '<div class="grid g4" style="margin-bottom:2rem">' + _sc('📊','var(--b)','#eff6ff',ss.length,'Total Sessions') + _sc('✅','var(--grn)','#f0fdf4',done.length,'Completed') + _sc('📋','var(--amb)','#fffbeb',tn,'Today') + _sc('👥','var(--pur)','#f5f3ff',bl,'Ballots') + '</div>';
  h += '<div class="grid g2">';
  h += '<div class="card"><div class="card-header"><span style="font-size:1.25rem">🔑</span><h3>Quick Actions</h3></div><div class="card-body">';
  h += '<button class="btn btn-primary btn-full" onclick="_navTo(\'generate\')" style="margin-bottom:.75rem">Generate Session Code</button>';
  h += '<button class="btn btn-secondary btn-full" onclick="_navTo(\'sessions\')">View All Sessions</button></div></div>';
  h += '<div class="card"><div class="card-header"><span style="font-size:1.25rem">👥</span><h3>User Management</h3></div><div class="card-body">';
  h += '<button class="btn btn-primary btn-full" onclick="_navTo(\'users\')">Manage Users</button></div></div></div>';
  return h;
}

function _sc(icon, color, bg, val, lbl) {
  return '<div class="stat-card"><div class="si" style="background:' + bg + ';color:' + color + '">' + icon + '</div><div><div class="sv">' + val + '</div><div class="sl">' + lbl + '</div></div></div>';
}

// ===== USER DASHBOARD =====
function _rUser() {
  var ss = _user.role === 'admin' ? (_load().sessions || []) : (_load().sessions || []).filter(function(s) { return s.createdBy === _user.username; });
  var done = ss.filter(function(s) { return s.status === 'completed'; });
  var today = new Date().toDateString();
  var tn = done.filter(function(s) { return s.completedAt && new Date(s.completedAt).toDateString() === today; }).length;

// ===== SESSION FLOW =====
function _startSess(count, type) {
  type = type || 'regular';
  var c = _gcode();
  var d = _load();
  while (d.sessions.some(function(s) { return s.sessionCode === c; })) c = _gcode();
  d.sessions.push({ id: _id(), sessionCode: c, status: 'in_progress', targetPanelistCount: count, testType: type, ballots: [], createdBy: _user.username, createdAt: _now(), completedAt: null });
  _save(d);
  _ac = c; _bn = 1; _bi = null; _st = type;
  _toast('Session ' + c + ' created!', 'ok');
  _view = 'ballot'; _render();
}

function _joinSess() {
  var inp = _el('jci');
  var code = (inp ? inp.value : _jc).trim().toUpperCase();
  if (!code) { _toast('Enter a session code', 'error'); return; }
  var d = _load();
  var s = null;
  for (var i = 0; i < d.sessions.length; i++) { if (d.sessions[i].sessionCode === code) { s = d.sessions[i]; break; } }
  if (!s) { _toast('Session not found', 'error'); return; }
  if (s.status === 'completed') { _toast('Session already completed', 'error'); return; }
  _ac = code; _bn = s.ballots.length + 1; _st = s.testType || 'regular';
  if (s.ballots.length > 0) {
    var f = s.ballots[0];
    _bi = { productType: f.productType, otherProductType: f.otherProductType, productCode: f.productCode, dateOfMfg: f.dateOfMfg, controlSampleCode: f.controlSampleCode, productTime: f.productTime };
  } else { _bi = null; }
  _jc = ''; _view = 'ballot'; _render();
  _toast('Joined ' + code + '!', 'ok');
}

function _viewSess(code) {
  var d = _load();
  var s = null;
  for (var i = 0; i < d.sessions.length; i++) { if (d.sessions[i].sessionCode === code) { s = d.sessions[i]; break; } }
  if (!s) { _toast('Not found', 'error'); return; }
  _vs = s; _view = 'report'; _render();
}

function _submitBallot(data) {
  var d = _load();
  var s = null;
  for (var i = 0; i < d.sessions.length; i++) { if (d.sessions[i].sessionCode === _ac) { s = d.sessions[i]; break; } }
  if (!s) { _toast('Failed', 'error'); return; }
  s.ballots.push(data);
  if (s.ballots.length >= s.targetPanelistCount) { s.status = 'completed'; s.completedAt = _now(); }
  _save(d);

  if (s.status === 'completed') { _vs = s; _view = 'report'; _render(); _toast('Session completed!', 'ok'); }
  else {
    _bn = s.ballots.length + 1;
    if (s.ballots.length === 1 && _st === 'regular') { _bi = { productType: data.productType, otherProductType: data.otherProductType, productCode: data.productCode, dateOfMfg: data.dateOfMfg, controlSampleCode: data.controlSampleCode, productTime: data.productTime }; }
    _render(); _toast('Submitted! ' + (s.targetPanelistCount - s.ballots.length) + ' more needed.', 'ok');
  }
}

  var fd = new FormData(_el('bf'));
  var cs = ['Control','Yellow','Brown','Blue','Green','Red','Purple'];
  var samples = cs.map(function(c, i) { return { colorCode: c, status: fd.get('s' + i + 'st'), offNote: fd.get('s' + i + 'on') || '' }; });
  _submitBallot({ panelistName: fd.get('pn'), testCode: fd.get('tc'), testDate: fd.get('td'), testTime: fd.get('tt'), roundNo: fd.get('rn'), provider: fd.get('pv'), samples: samples });
}

function _rProf() {
  var nd = new Date(), cd = nd.toISOString().split('T')[0], ct = nd.toTimeString().slice(0, 5);
  var cs = ['Control','Yellow','Brown','Blue','Green','Red','Purple'];
  var h = '<form id="bf" onsubmit="event.preventDefault();_submitBlind()"><div class="card" style="margin-bottom:1rem"><div class="card-body"><div class="grid g2">';
  h += '<div class="field"><label>Name *</label><input name="pn" required></div><div class="field"><label>Test Code</label><input name="tc"></div>';
  h += '<div class="field"><label>Date *</label><input name="td" type="date" required value="' + cd + '"></div><div class="field"><label>Time *</label><input name="tt" type="time" required value="' + ct + '"></div>';
  h += '<div class="field"><label>Round *</label><input name="rn" required value="1"></div><div class="field"><label>Provider</label><input name="pv"></div></div></div></div>';
  h += '<div class="card" style="margin-bottom:1rem"><div class="card-header"><h3>Proficiency Samples</h3></div><div class="card-body">';
  cs.forEach(function(c, ci) {
    h += '<div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:.5rem;margin-bottom:.5rem;align-items:center;padding:.5rem;border:1px solid var(--brd);border-radius:.5rem">';
    h += '<span class="badge" style="background:' + _cbg(c) + ';color:' + _ct(c) + ';font-weight:700;min-width:5rem;justify-content:center">' + c + '</span>';
    h += '<select name="s' + ci + 'st"><option value="IN">IN</option><option value="OUT">OUT</option></select>';
    h += '<input name="s' + ci + 'on" placeholder="OFF Note"></div>';
  });
  h += '</div></div><button type="submit" class="btn btn-primary btn-full" style="height:3rem">Submit</button></form>';
  return h;
}

// ===== REPORT =====
function _rReport() {
  var s = _vs;
  if (!s) return '<p>No session</p>';
  var ballots = s.ballots || [], total = s.targetPanelistCount;
  var pct = Math.min(100, Math.round((ballots.length / total) * 100));
  var isB = s.testType === 'blind' || s.testType === 'proficiency';
  var checks = 0, ins = 0;
  var cat = { Appearance: { i: 0, t: 0 }, Odour: { i: 0, t: 0 }, Taste: { i: 0, t: 0 } };
  ballots.forEach(function(b) {
    ['appearance', 'odour', 'taste'].forEach(function(k) {
      if (b[k] && b[k].status) { var lk = k.charAt(0).toUpperCase() + k.slice(1); cat[lk].t++; checks++; if (b[k].status === 'IN') { cat[lk].i++; ins++; } }
    });
  });
  var pp = checks ? Math.round((ins / checks) * 100) : null;
  var ap = pp === 100;

  var h = '<div style="max-width:50rem;margin:0 auto"><div style="display:flex;justify-content:space-between;margin-bottom:1rem"><button class="btn btn-sm btn-secondary" onclick="_navTo(\'dashboard\')">← Dashboard</button><button class="btn btn-sm btn-primary" onclick="window.print()">Print</button></div>';
  var qc = ap ? 'var(--grn)' : 'var(--red)', qb = ap ? '#f0fdf4' : '#fef2f2';
  h += '<div class="grid g3" style="margin-bottom:1.5rem">' + _sc('👥','var(--b)','#eff6ff',ballots.length+'/'+total,'Panelists');
  h += '<div class="stat-card"><div class="si" style="background:' + qb + ';color:' + qc + '">✅</div><div><div class="sv" style="color:' + qc + '">' + (pp !== null ? pp+'%' : '—') + '</div><div class="sl">Quality</div></div></div>';
  h += _sc('📋','var(--pur)','#f5f3ff',s.testType||'regular','Type') + '</div>';

  var title = s.testType === 'blind' ? 'Blind Test Report' : s.testType === 'proficiency' ? 'Proficiency Report' : 'Sensory Evaluation Report';
  h += '<div class="report-card"><div class="report-header"><h1>' + title + '</h1><p>Global Acqua Pvt Ltd</p>';
  h += '<div style="display:flex;gap:1rem;margin-top:1rem"><div class="badge bb" style="font-family:\'Space Grotesk\',monospace;padding:.5rem 1rem">' + s.sessionCode + '</div>';
  h += '<div style="font-size:.8125rem;color:var(--t3)">' + _fmtDt(s.completedAt || s.createdAt) + '</div></div></div><div class="report-body">';

  ['Appearance','Odour','Taste'].forEach(function(n) {
    var cv = cat[n]; if (cv.t === 0) return;
    var cp = Math.round((cv.i / cv.t) * 100), cc = cp === 100 ? 'var(--grn)' : 'var(--b)';
    h += '<div style="margin-bottom:.75rem"><div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.25rem"><span style="font-weight:600">' + n + '</span><span style="font-weight:700;color:' + cc + '">' + cp + '% IN (' + cv.i + '/' + cv.t + ')</span></div>';
    h += '<div style="height:.5rem;background:#f1f5f9;border-radius:999px;overflow:hidden"><div style="height:100%;width:' + cp + '%;background:' + cc + ';border-radius:999px"></div></div></div>';
  });

  h += '<h3 style="font-weight:600;margin:1.5rem 0 1rem">Panelist Evaluations</h3>';
  ballots.forEach(function(b, idx) {
    var pBg = isB ? '#f5f3ff' : '#eff6ff', pBd = isB ? '#ede9fe' : '#dbeafe', pC = isB ? 'var(--pur)' : 'var(--b)';
    h += '<div style="border:1px solid var(--brd);border-radius:.75rem;margin-bottom:1rem;overflow:hidden">';
    h += '<div style="background:' + pBg + ';padding:.75rem 1rem;border-bottom:1px solid ' + pBd + ';display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:.5rem"><span style="width:1.75rem;height:1.75rem;background:' + pC + ';color:#fff;border-radius:.375rem;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700">' + (idx+1) + '</span><span style="font-weight:600">' + _esc(b.panelistName || 'P'+(idx+1)) + '</span></div>';
    if (b.testingCompletionDate) h += '<span style="font-size:.6875rem;color:var(--t3)">' + b.testingCompletionDate + '</span>';
    h += '</div><div style="padding:1rem">';

    if (isB && b.samples) {
      h += '<table style="width:100%"><thead><tr><th>Sl</th><th>Color</th><th>Result</th><th>OFF Note</th></tr></thead><tbody>';
      b.samples.forEach(function(sm, si) {
        h += '<tr><td>' + (sm.colorCode==='Control'?'C':si) + '</td><td><span class="badge" style="background:' + _cbg(sm.colorCode) + ';color:' + _ct(sm.colorCode) + '">' + sm.colorCode + '</span></td>';
        h += '<td><span class="badge ' + (sm.status==='IN'?'bg':'br') + '">' + (sm.colorCode==='Control'?'IN':sm.status) + '</span></td><td>' + (sm.offNote||'-') + '</td></tr>';
      });
      h += '</tbody></table>';
    } else {
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.5rem;margin-bottom:.75rem">';
      if (b.productType) h += '<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Type</div><div style="font-size:.8125rem;font-weight:600">' + _esc(b.productType) + '</div></div>';
      if (b.productCode) h += '<div style="background:#fafbfc;padding:.5rem;border-radius:.5rem"><div style="font-size:.625rem;font-weight:600;color:var(--t4);text-transform:uppercase">Code</div><div style="font-size:.8125rem;font-weight:600;font-family:monospace">' + _esc(b.productCode) + '</div></div>';
      h += '</div>';
      ['appearance','odour'].concat(b.productType!=='Raw Water'?['taste']:[]).forEach(function(k) {
        if (!b[k]) return;
        var rc = b[k].status === 'IN' ? 'pass' : 'fail';
        h += '<div class="result-row ' + rc + '"><span style="font-weight:500">' + k.charAt(0).toUpperCase()+k.slice(1) + '</span><div style="display:flex;align-items:center;gap:.5rem"><span class="badge ' + (b[k].status==='IN'?'bg':'br') + '">' + b[k].status + '</span>';
        if (b[k].status === 'OUT') h += '<span style="font-size:.75rem;color:var(--red)">' + _esc(b[k].reason) + '</span>';
        h += '</div></div>';
      });
      if (b.remarks) h += '<div style="margin-top:.5rem;background:#fafbfc;padding:.5rem;border-radius:.5rem;font-size:.8125rem"><b>Remarks:</b> ' + _esc(b.remarks) + '</div>';
    }
    h += '</div></div>';
  });
  h += '<div style="text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid #f1f5f9;font-size:.75rem;color:var(--t4)">Generated by <b>Global Acqua Pvt Ltd</b></div></div></div></div>';
  return h;
}

function _rActive() {
  var d = _load();
  var s = null;
  for (var i = 0; i < d.sessions.length; i++) { if (d.sessions[i].sessionCode === _ac) { s = d.sessions[i]; break; } }
  if (!s) return '<p>No active session.</p>';
  if (s.status === 'completed') { _vs = s; _view = 'report'; return _rReport(); }
  _view = 'ballot'; return _rBallot();
}

// ===== REPORTS MODAL =====
function _openRpt(type) {
  var ss = _load().sessions || [];
  var f;
  if (type === 'daily') f = ss.filter(function(s) { return (!s.testType || s.testType === 'regular') && s.status === 'completed'; });
  else if (type === 'blind') f = ss.filter(function(s) { return s.testType === 'blind' && s.status === 'completed'; });
  else f = ss.filter(function(s) { return s.testType === 'proficiency' && s.status === 'completed'; });

  var title = type === 'daily' ? 'Daily Summary' : type === 'blind' ? 'Blind Test Summary' : 'Proficiency Summary';
  var h = '<div style="max-height:70vh;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h3 style="font-weight:700">' + title + '</h3><button class="btn btn-sm btn-secondary" onclick="_el(\'mover\').classList.remove(\'show\')">Close</button></div>';
  h += '<div class="table-wrap"><table style="width:100%;font-size:.8125rem"><thead><tr><th>Code</th><th>Product</th><th>Panelists</th><th>Result</th><th>Date</th></tr></thead><tbody>';
  if (f.length) {
    f.forEach(function(s) {
      var fb = s.ballots[0] || {};
      var allIn = s.ballots.every(function(x) { return (x.appearance && x.appearance.status === 'IN') && (x.odour && x.odour.status === 'IN'); });
      h += '<tr><td style="font-weight:700;color:var(--b)">' + s.sessionCode + '</td><td>' + _esc(fb.productType || '-') + '</td>';
      h += '<td>' + s.ballots.length + '/' + s.targetPanelistCount + '</td>';
      h += '<td><span class="badge ' + (allIn ? 'bg' : 'br') + '">' + (allIn ? 'IN' : 'OUT') + '</span></td><td>' + _fmt(s.completedAt) + '</td></tr>';
    });
  } else { h += '<tr><td colspan="5" style="text-align:center;color:var(--t4);padding:2rem">No completed sessions</td></tr>'; }
  h += '</tbody></table></div></div>';
  _el('mcont').innerHTML = h;
  _el('mover').classList.add('show');
}

function _createUser() {
  var u = _el('nu').value.trim(), p = _el('np').value, r = _el('nr').value;
  if (!u || !p) { _toast('Username and password required', 'error'); return; }
  var d = _load();
  for (var i = 0; i < d.users.length; i++) { if (d.users[i].username === u) { _toast('Already exists', 'error'); return; } }
  d.users.push({ id: _id(), username: u, password: _hash(p), role: r, createdAt: _now() });
  _save(d); _toast('User created!', 'ok'); _render();
}

function _delUser(u) {
  if (u === _user.username) { _toast('Cannot delete yourself', 'error'); return; }
  if (!confirm('Delete ' + u + '?')) return;
  var d = _load(); d.users = d.users.filter(function(x) { return x.username !== u; }); _save(d);
  _toast('Deleted', 'ok'); _render();
}

function _delSess(c) {
  if (!confirm('Delete ' + c + '?')) return;
  var d = _load(); d.sessions = d.sessions.filter(function(x) { return x.sessionCode !== c; }); _save(d);
  _toast('Deleted', 'ok'); _render();
}

function _doGen() {
  var c = _gcode();
  var d = _load();
  while (d.sessions.some(function(s) { return s.sessionCode === c; })) c = _gcode();
  var gt = _el('gtype') ? _el('gtype').value : _gt;
  var gc = _el('gcnt') ? _el('gcnt').value : _gc;
  _gt = gt; _gc = gc;
  d.sessions.push({ id: _id(), sessionCode: c, status: 'in_progress', targetPanelistCount: parseInt(gc), testType: gt, ballots: [], createdBy: _user.username, createdAt: _now(), completedAt: null });
  _save(d);
  _gcodeVal = c;
  _toast('Session ' + c + ' created!', 'ok');
  _render();
}

function _copyCd() {
  if (navigator.clipboard) navigator.clipboard.writeText(_gcodeVal).then(function() { _toast('Copied!', 'info'); });
  else _toast('Code: ' + _gcodeVal, 'info');
}

function _toggleSidebar() { _el('sidebar').classList.toggle('open'); }

// ===== INIT =====
_log('Starting...');
_init();

// Wire up buttons with onclick
_el('login-btn').onclick = function() { doLogin(); };
_el('logout-btn').onclick = function() { doLogout(); };
_el('hamburger-btn').onclick = function() { _toggleSidebar(); };
_el('mover').onclick = function(e) { if (e.target === _el('mover')) _el('mover').classList.remove('show'); };

// Enter key support
_el('login-pass').onkeydown = function(e) { if (e.key === 'Enter') doLogin(); };
_el('login-user').onkeydown = function(e) { if (e.key === 'Enter') _el('login-pass').focus(); };

_log('App ready. Buttons wired.');
</script>
</body>
</html>
